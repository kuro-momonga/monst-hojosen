<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補助線">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>反射補助線ツール</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaef; --muted:#8b93a3;
    --accent:#ffcf3f; --accent2:#4fd1ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
  body{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #stage{flex:1;position:relative;min-height:0;margin-top:env(safe-area-inset-top)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);
    padding:6px 12px;border-radius:999px;font-size:12px;color:#fff;pointer-events:none;white-space:nowrap}
  #panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button,.btn{appearance:none;border:1px solid var(--line);background:#222733;color:var(--text);
    border-radius:8px;padding:8px 9px;font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer;line-height:1}
  button:active{transform:scale(.97)}
  button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent}
  .seg button.on{background:var(--accent);color:#1a1a1a}
  label.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap}
  label.sl input{flex:1;min-width:0;width:60px;accent-color:var(--accent)}
  label.sl b{color:var(--text);min-width:24px;text-align:right}
  #angle{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:64px;text-align:center;font-size:15px}
  .grow{flex:1}
  input[type=file]{display:none}
  .small{font-size:11px;color:var(--muted)}
  #panel{position:relative}
  #menu{display:none;position:absolute;right:10px;bottom:calc(100% + 6px);width:230px;background:#1f232c;
    border:1px solid var(--line);border-radius:12px;padding:8px;flex-direction:column;gap:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
  #menu.open{display:flex}
  #menu button{text-align:left;width:100%;padding:11px 10px}
  #menu label.sl{padding:4px 2px}
  #fieldBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #fieldBar.show{display:flex}
  #enemyBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #enemyBar.show{display:flex}
  #enemyBar button{padding:8px 8px}
  #enemyBar .seg{background:#181b22}
  #toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,22,28,.95);
    border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;
    display:none;align-items:center;gap:10px;z-index:9;white-space:nowrap}
  #toast.show{display:flex}
  #tabs{display:flex;gap:4px;flex:1}
  #tabs button{flex:1;padding:9px 4px;background:#1c2029}
  #tabs button.on{background:var(--accent);color:#1a1a1a}
  .stepRow{display:none;gap:6px;align-items:center;flex-wrap:nowrap}
  .stepRow.show{display:flex}
  #stab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
  #stab button{padding:5px 8px;font-size:12px}
  .next{background:#2d3b55;border-color:#3d5378}
  #pad{height:86px;border:1px dashed #3a4252;border-radius:12px;background:repeating-linear-gradient(45deg,#1a1e26,#1a1e26 6px,#1c2129 6px,#1c2129 12px);
    touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;user-select:none;-webkit-user-select:none}
  #pad.active{border-color:var(--accent);color:var(--text)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;align-items:flex-end;justify-content:center}
  #modal.show{display:flex}
  #sheet{background:#1b1f27;border-top-left-radius:16px;border-top-right-radius:16px;width:100%;max-width:520px;max-height:85%;overflow:auto;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  #sheet h3{margin:2px 0 4px;font-size:16px}
  #sheet .q{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #sheet .qh{display:flex;align-items:center;gap:6px}
  #sheet .qh b{flex:1;font-size:14px}
  #sheet .st{display:flex;align-items:center;gap:6px;padding-left:6px}
  #sheet .st span{flex:1;color:var(--muted)}
  #sheet input[type=text],#sheet textarea{width:100%;background:#11141a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px}
  #sheet textarea{height:120px;font-size:11px}
  .danger{color:#ff8a8a}
  #stageLabel{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint"></div>
  <div id="stageLabel"></div>
  <div id="fieldBar"><button id="resetField">↺ 初期位置</button><button id="fieldDone" class="on">完了</button></div>
</div>
<div id="panel">
  <div class="row" style="flex-wrap:nowrap;gap:5px">
    <button id="btnImg">🖼 画像</button>
    <input id="file" type="file" accept="image/*">
    <div id="tabs"><button data-step="ball">① 玉</button><button data-step="place">② 配置</button><button data-step="aim">③ 狙う</button></div>
    <button id="more" title="その他">⋯</button>
  </div>
  <div class="stepRow" id="row-ball">
    <span class="small grow">キャラの真ん中をタップ → 拡大されるので、十字をキャラの中心に合わせる</span>
    <button id="zoomBtn">🔍 全体</button>
    <button class="next" data-go="place">次へ ▶</button>
  </div>
  <div class="stepRow" id="row-place">
    <div class="seg"><button id="shCircle" class="on">● 敵</button><button id="shRect">■ ブロック</button></div>
    <button id="szMinus" title="敵を小さく">−</button><button id="szPlus" title="敵を大きく">＋</button>
    <button id="eDel">削除</button>
    <span class="grow"></span>
    <button class="next" data-go="aim">次へ ▶</button>
  </div>
  <div class="stepRow" id="row-aim">
    <button data-da="-1">−1°</button>
    <button data-da="-0.1">−.1</button>
    <span id="angle">0.0°</span>
    <button data-da="0.1">+.1</button>
    <button data-da="1">+1°</button>
  </div>
  <div class="stepRow" id="row-type">
    <div class="seg"><button id="tRef">反射</button><button id="tPie">貫通</button></div>
    <button id="tAB">アンチブロック</button>
  </div>
  <div class="stepRow" id="row-stab"><span id="stab" class="small" style="display:none"></span></div>
  <div class="stepRow" id="row-aim2">
    <span class="small">反射</span>
    <button id="bMinus">−</button>
    <b id="bv" style="min-width:22px;text-align:center;font-size:15px">5</b>
    <button id="bPlus">＋</button>
    <span class="grow"></span>
    <button id="mArrow">矢印</button>
    <button id="mFinger">指</button>
    <button id="pin">固定</button>
  </div>
  <div id="pad">パッド</div>
  <div id="menu">
    <button id="stages">📁 ステージ保存・読み込み</button>
    <button id="dim">画面：通常</button>
    <button id="detect">敵・ブロックを自動検出</button>
    <button id="eClear" class="danger">敵とブロックを全部消す</button>
    <button id="clearPins">固定した線を消す</button>
    <button id="mField">枠を調整する</button>
    <button id="width">玉の通り道を表示</button>
    <button id="wobble">ブレ幅 ±0.5°</button>
    <button id="pull">タッチした方向に飛ばす</button>
    <label class="sl">玉の当たり半径 <input id="radius" type="range" min="20" max="120" value="55"><b id="rv">55</b></label>
    <div class="small" style="text-align:right" id="ver"></div>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
(() => {
  const VERSION = '2.22';
  // home-screen app: reload when a newer version is deployed
  async function checkUpdate() {
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
      const {v} = await r.json();
      if (v && v !== VERSION && sessionStorage.getItem('reloadedFor') !== v) {
        sessionStorage.setItem('reloadedFor', v);
        location.replace(location.pathname + '?v=' + v);
      }
    } catch (e) {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const loupe = document.createElement('canvas');

  // ---- state (all in image-pixel coordinates) ----
  let img = null;                    // HTMLImageElement or null
  let IW = 1170, IH = 2532;          // virtual size when no image (iPhone screenshot)
  // ratio of image size. Calibrated from 2 gameplay videos (iPhone 1170x2532):
  // ball CENTER bounces at x=52..1117, y=480..1692 (wall line minus WALL_PAD).
  const DEFAULT_FIELD = {l: 40 / 1170, t: 468 / 2532, r: 1129 / 1170, b: 1704 / 2532};
  const OLD_DEFAULT = {l: .035, t: .187, r: .965, b: .676};
  const WALL_PAD = 12 / 1170;
  const GUIDE_R = 100 / 1170;
  // Block = one cell of the 8-column grid (1170/8 = 146.25px), measured from gameplay video.
  // Minion hitbox: measured radius ≈73px on 2 different enemies (of 1170); centre ≈93–114px above its HP bar.
  const MINION_R = 73;
  const BLOCK = 1 / 8;            // cell width / stack pitch (146.25px of 1170)
  const BLOCK_H = 169 / 1170;     // hitbox height: sprite top-8 .. sprite bottom+5 (measured)
  const blockImg = new Image(); blockImg.src = 'block.png'; blockImg.onload = () => draw();
  // blocks are 146x146 cells; when near another block, snap so they connect edge to edge
  function placeBlock(l, t, self = -1) {
    const W = BLOCK * IW, snap = W * .35;
    let best = null, bd = snap;
    S.blocks.forEach((B, k) => {
      if (k === self) return;
      for (const [cl, ct] of [[B.l - W, B.t], [B.l + W, B.t], [B.l, B.t - W], [B.l, B.t + W]]) {   // stack pitch = W
        const d = Math.hypot(cl - l, ct - t);
        if (d < bd && !S.blocks.some((o, j) => j !== self && j !== k && Math.abs(o.l - cl) < 1 && Math.abs(o.t - ct) < 1)) { bd = d; best = [cl, ct]; }
      }
    });
    if (best) [l, t] = best;
    return {l, t, r: l + W, b: t + BLOCK_H * IW};
  }

  // ---- block auto-detection (template = top face of the block sprite, normalized cross-correlation) ----
  let tplCache = null;
  function grayAt(src, sx, sy, sw, sh, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) out[i] = d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114;
    return out;
  }
  function detectBlocks() {
    if (!img || !blockImg.naturalWidth) return [];
    const k = 4 * IW / 1170;                 // work at 1/4 scale of a 1170-wide screen
    const tw = Math.round(112 / 4), th = Math.round(100 / 4);
    if (!tplCache) {
      const t = grayAt(blockImg, 12, 6, 112, 100, tw, th);
      let m = 0; t.forEach(v => m += v); m /= t.length;
      let ss = 0; for (let i = 0; i < t.length; i++) { t[i] -= m; ss += t[i] * t[i]; }
      tplCache = {t, n: Math.sqrt(ss)};
    }
    const {t, n: tn} = tplCache;
    const f = S.field, x0 = Math.max(0, f.l - 20), y0 = Math.max(0, f.t - 60);
    const W = Math.round((f.r - x0 + 20) / k), H = Math.round((f.b - y0 + 20) / k);
    const g = grayAt(img, x0, y0, W * k, H * k, W, H);
    const RW = W - tw, RH = H - th, res = new Float32Array(Math.max(0, RW * RH));
    // integral images for fast local mean/variance
    const I = new Float64Array((W + 1) * (H + 1)), I2 = new Float64Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = g[y * W + x], i = (y + 1) * (W + 1) + x + 1;
      I[i] = v + I[i - 1] + I[i - W - 1] - I[i - W - 2]; I2[i] = v * v + I2[i - 1] + I2[i - W - 1] - I2[i - W - 2];
    }
    const N = tw * th;
    for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
      const a = y * (W + 1) + x, b = a + tw, c = a + th * (W + 1), d = c + tw;
      const sum = I[d] - I[b] - I[c] + I[a], sum2 = I2[d] - I2[b] - I2[c] + I2[a];
      const vs = sum2 - sum * sum / N; if (vs < 1e-3) continue;
      let acc = 0;
      for (let j = 0; j < th; j++) { const row = (y + j) * W + x, tr = j * tw; for (let i = 0; i < tw; i++) acc += g[row + i] * t[tr + i]; }
      res[y * RW + x] = acc / (Math.sqrt(vs) * tn);
    }
    const score = (ix, iy) => {        // best score near an image-px position of the sprite-face top-left
      const cx = Math.round((ix - x0) / k), cy = Math.round((iy - y0) / k); let m = -1;
      for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++)
        if (x >= 0 && y >= 0 && x < RW && y < RH) m = Math.max(m, res[y * RW + x]);
      return m;
    };
    // peaks
    const peaks = [], r2 = res.slice();
    for (;;) {
      let bi = -1, bv = .6;
      for (let i = 0; i < r2.length; i++) if (r2[i] > bv) { bv = r2[i]; bi = i; }
      if (bi < 0) break;
      const px = bi % RW, py = (bi / RW) | 0;
      peaks.push({x: x0 + px * k, y: y0 + py * k, s: bv});
      for (let y = py - 18; y <= py + 18; y++) for (let x = px - 18; x <= px + 18; x++) if (x >= 0 && y >= 0 && x < RW && y < RH) r2[y * RW + x] = -1;
    }
    // colour check: block face is dull grey (low saturation, mid brightness) and its base is very dark
    const u = IW / 1170;
    const cc = document.createElement('canvas').getContext('2d', {willReadFrequently: true});
    const stats = (x, y, w, h) => {
      cc.canvas.width = Math.max(1, Math.round(w / 2)); cc.canvas.height = Math.max(1, Math.round(h / 2));
      cc.drawImage(img, x, y, w, h, 0, 0, cc.canvas.width, cc.canvas.height);
      const d = cc.getImageData(0, 0, cc.canvas.width, cc.canvas.height).data; let S = 0, V = 0, n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) { const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]); V += mx; S += mx ? (mx - mn) / mx * 255 : 0; }
      return {S: S / n, V: V / n};
    };
    const looksLikeBlock = q => {
      const face = stats(q.x, q.y, 112 * u, 100 * u), base = stats(q.x, q.y + 120 * u, 112 * u, 18 * u);
      // stacked blocks: the "base" is the next block's face, not a dark shadow → trust a strong match
      return face.S < 90 && face.V > 95 && face.V < 145 && (base.V < 60 || q.s >= .85);
    };
    const P = BLOCK * IW, near = (a, b) => Math.abs(a - b) < 10 * IW / 1170;
    const aligned = (a, b) => (near(a.x, b.x) && Math.abs(Math.round((a.y - b.y) / P) * P - (a.y - b.y)) < 12) ||
                              (near(a.y, b.y) && Math.abs(Math.round((a.x - b.x) / P) * P - (a.x - b.x)) < 12);
    let found = peaks.filter(looksLikeBlock);
    // align columns / rows: blocks in a stack share x (rows share y); partly hidden ones match a few px off
    const snapAxis = ax => found.forEach(q => {
      const mates = found.filter(o => Math.abs(o[ax] - q[ax]) < 24 * u);
      const best = mates.reduce((a, b) => (b.s > a.s ? b : a), q);
      q[ax] = best[ax];
    });
    snapAxis('x'); snapAxis('y');
    // blocks in a row are spaced exactly one cell apart: fit the row's grid offset and snap
    // (fixes edge blocks partly hidden by the side walls, which match a few px off)
    const P0 = BLOCK * IW, rows = [];
    found.forEach(q => { const r = rows.find(R => Math.abs(R[0].y - q.y) < 12 * u); r ? r.push(q) : rows.push([q]); });
    rows.forEach(R => {
      if (R.length < 2) return;
      const inner = R.filter(q => q.x > f.l + 40 * u && q.x + 130 * u < f.r - 20 * u);
      const ref = (inner.length ? inner : R).reduce((a, b) => (b.s > a.s ? b : a));
      R.forEach(q => { q.x = ref.x + Math.round((q.x - ref.x) / P0) * P0; });
    });
    // fill gaps inside straight runs (blocks partly hidden by enemies)
    for (const a of found.slice()) for (const b of found.slice()) {
      for (const [ax, dir] of [['x', 'y'], ['y', 'x']]) {
        if (!near(a[ax], b[ax]) || b[dir] <= a[dir]) continue;
        const steps = Math.round((b[dir] - a[dir]) / P);
        if (steps < 2 || steps > 6 || Math.abs(steps * P - (b[dir] - a[dir])) > 12) continue;
        for (let m = 1; m < steps; m++) {
          const q = {[ax]: a[ax], [dir]: a[dir] + m * (b[dir] - a[dir]) / steps};
          if (found.some(o => near(o.x, q.x) && near(o.y, q.y))) continue;
          if (score(q.x, q.y) >= .35) found.push({...q, s: 0});
        }
      }
    }
    // extend lines of blocks outward (blocks half hidden by the side walls, or stacked ones whose base isn't dark)
    const has = (x, y) => found.some(o => Math.abs(o.x - x) < 14 * u && Math.abs(o.y - y) < 14 * u);
    const visibleFace = (x, y, faceOnly) => {       // colour test on the part of the face that is inside the field
      const xa = Math.max(x, f.l + 4 * u), xb = Math.min(x + 112 * u, f.r - 4 * u);
      if (xb - xa < 30 * u) return false;
      const fc = stats(xa, y, xb - xa, 100 * u);
      const bs = stats(xa, y + 120 * u, xb - xa, 18 * u);
      return fc.S < 90 && fc.V > 95 && fc.V < 145 && (faceOnly || bs.V < 60 || (bs.S < 90 && bs.V > 95 && bs.V < 145));
    };
    for (let pass = 0; pass < 8; pass++) {
      let added = 0;
      for (const q of found.slice()) for (const [ddx, ddy] of [[P, 0], [-P, 0], [0, P], [0, -P]]) {
        if (!has(q.x - ddx, q.y - ddy) && q.s < .9) continue;      // must be part of a line (or a very sure block)
        const nx = q.x + ddx, ny = q.y + ddy;
        if (has(nx, ny) || nx + 112 * u < f.l + 30 * u || nx > f.r - 30 * u || ny < f.t - 124 * u || ny > f.b - 34 * u) continue;
        const edge = nx < f.l + 20 * u || nx + 112 * u > f.r - 20 * u;
        const ok = edge ? (ddy === 0 && visibleFace(nx, ny, true)) : (score(nx, ny) >= .62 && visibleFace(nx, ny));
        if (ok) { found.push({x: nx, y: ny, s: .5}); added++; }
      }
      if (!added) break;
    }
    // sprite-face top-left -> cell (face starts 5px into the sprite, sprite 5px into the cell, hitbox top 8px above sprite)
    return found.filter(q => q.y > f.t - 124 && q.y < f.b - 34)
                .map(q => { const l = q.x - 17 * IW / 1170, tt = q.y - 14 * IW / 1170; return {l, t: tt, r: l + P, b: tt + BLOCK_H * IW}; });
  }
  // ---- enemy auto-detection: every non-boss enemy has a small yellow HP bar under it ----
  // Measured: hit-circle centre ≈ bar centre x, 93px above the bar; minion hit radius ≈ 73px (of 1170).
  function detectEnemies() {
    if (!img) return [];
    const u = IW / 1170, f = S.field;
    const x0 = Math.max(0, Math.round(f.l - 30 * u)), y0 = Math.max(0, Math.round(f.t - 40 * u));

  const wallPad = () => WALL_PAD * IW;
  const S = {
    field: {l: DEFAULT_FIELD.l * IW, t: DEFAULT_FIELD.t * IH, r: DEFAULT_FIELD.r * IW, b: DEFAULT_FIELD.b * IH},

  const toRatio = () => ({
    field: {l: S.field.l / IW, t: S.field.t / IH, r: S.field.r / IW, b: S.field.b / IH},
    ball: {x: S.ball.x / IW, y: S.ball.y / IH},
    r: S.r / IW, angle: S.angle, bounces: S.bounces, pointAim: S.pointAim, showWidth: S.showWidth, pierce: S.pierce, antiBlock: S.antiBlock, dim: S.dim,

  };

  // ---- view transform ----
  let scale = 1, ox = 0, oy = 0, dpr = 1;
  function layout() {
    dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    // aim mode: show only the field (+ small margin); field mode: whole screenshot
    let V;
    if (mode === 'field' || mode === 'finger') V = {x: 0, y: 0, w: IW, h: IH};
    else if (mode === 'ball' && ballZoom) {   // zoomed view around the ball for precise placement
      const zw = 560 * IW / 1170, zh = zw * h / w;
      V = {x: ballZoom[0] - zw / 2, y: ballZoom[1] - zh / 2, w: zw, h: zh};
    }
    else {

  const toS = (x, y) => [ox + x * scale, oy + y * scale];

  // ---- enemy hitbox: "カクカクの丸" = a circle made of stacked axis-aligned steps ----
  // Guide video: off enemies the ball reflects exactly like off walls/blocks (only x or y flips);
  // odd bounces appear only at a few angles = the step corners. e.R = radius of the stepped circle.
  const STEPS = 12;  // steps per half (top/bottom)
  function stepRects(e) {
    const out = [];

      const y0 = e.R * k / STEPS, y1 = e.R * (k + 1) / STEPS, yc = (y0 + y1) / 2;

    }

  // ray vs axis-aligned box expanded by pad (same rule as blocks): returns {t, fx, fy}
  function rayBox(x, y, dx, dy, B, pad) {

    if (x > l && x < r && y > tp && y < bt) return null;
    let txn, txf, tyn, tyf;
    if (Math.abs(dx) < 1e-9) { if (x <= l || x >= r) return null; txn = -Infinity; txf = Infinity; }
    else { const a1 = (l - x) / dx, a2 = (r - x) / dx; txn = Math.min(a1, a2); txf = Math.max(a1, a2); }
    if (Math.abs(dy) < 1e-9) { if (y <= tp || y >= bt) return null; tyn = -Infinity; tyf = Infinity; }

  let dragInfo = null;

      };
      if (S.enemies.length || S.blocks.length) {
        openSheet(`<h3>前の配置はどうしますか？</h3>
          <div class="small">敵 ${S.enemies.length}体・ブロック ${S.blocks.length}個が置かれています</div>
          <button id="keepP" class="on" style="padding:13px">そのまま使う（玉の位置だけ決める）</button>
          <button id="resetP" style="padding:13px">リセットして作り直す（敵・ブロックを自動検出）</button>`,
          sh => { sh.querySelector('#keepP').onclick = () => after(false); sh.querySelector('#resetP').onclick = () => after(true); });
        setMode('ball');
      } else after(true);
    };
    im.src = url;
  }
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

  // ---- stage library (quest -> stages). Saves frame, blocks, enemies (not the ball) ----
  const LIB_KEY = 'monst-stages-v1';
  let cur = null;   // {q: quest name, s: stage index} of the loaded stage
  const loadLib = () => { try { return JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch (e) { return []; } };
  const saveLib = L => { try { localStorage.setItem(LIB_KEY, JSON.stringify(L)); return true; } catch (e) { toast('保存できませんでした'); return false; } };
  const snapshot = () => { const R = toRatio(); return {field: R.field, blocks: R.blocks, enemies: R.enemies, savedAt: Date.now()}; };
  function applyStage(st) {
    fromRatio({field: st.field, blocks: st.blocks || [], enemies: st.enemies || []});
    selEnemy = selBlock = -1; S.pins = []; persist();
  }
  function stageSheet() {
    const L = loadLib();
    let html = `<h3>📁 ステージ保存・読み込み</h3>
      <div class="small">枠・ブロック・敵の配置を保存します（玉の位置は保存しません）</div>`;
    L.forEach((q, qi) => {
      html += `<div class="q"><div class="qh"><b>${esc(q.name)}</b><button data-delq="${qi}" class="danger">削除</button></div>`;
      q.stages.forEach((st, si) => {
        const isCur = cur && cur.q === q.name && cur.s === si;
        html += `<div class="st"><span>ステージ${si + 1}${isCur ? '（表示中）' : ''}　敵${(st.enemies || []).length}・ブロック${(st.blocks || []).length}</span>
          <button data-load="${qi},${si}">読込</button><button data-over="${qi},${si}">上書き</button><button data-dels="${qi},${si}" class="danger">✕</button></div>`;
      });
      html += `<button data-add="${qi}">＋ 今の配置をステージ${q.stages.length + 1}として保存</button></div>`;
    });
    html += `<div class="q"><div class="small">新しいクエスト</div><input type="text" id="qname" placeholder="クエスト名（例：〇〇 超究極）">
      <button id="qcreate">作成して今の配置をステージ1に保存</button></div>
      <div class="row"><button id="bkOut">バックアップを書き出す</button><button id="bkIn">バックアップを読み込む</button></div>
      <button id="closeS">閉じる</button>`;
    openSheet(html, sh => {
      const armed = {};   // tap twice to delete
      const confirm2 = (btn, key, fn) => { if (armed[key]) fn(); else { armed[key] = 1; btn.textContent = 'もう一度押すと削除'; } };
      sh.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
        const [qi, si] = b.dataset.load.split(',').map(Number); applyStage(L[qi].stages[si]);
        cur = {q: L[qi].name, s: si}; closeSheet(); setMode('ball'); toast(`${esc(L[qi].name)} ステージ${si + 1}を読み込みました`, 2500);
      });
      sh.querySelectorAll('[data-over]').forEach(b => b.onclick = () => {
        const [qi, si] = b.dataset.over.split(',').map(Number); L[qi].stages[si] = snapshot();
        if (saveLib(L)) { cur = {q: L[qi].name, s: si}; toast('上書き保存しました', 2000); stageSheet(); syncUI(); }
      });
      sh.querySelectorAll('[data-dels]').forEach(b => b.onclick = () => confirm2(b, 's' + b.dataset.dels, () => {
        const [qi, si] = b.dataset.dels.split(',').map(Number); L[qi].stages.splice(si, 1);
        if (cur && cur.q === L[qi].name) cur = null; saveLib(L); stageSheet(); syncUI();
      }));
      sh.querySelectorAll('[data-delq]').forEach(b => b.onclick = () => confirm2(b, 'q' + b.dataset.delq, () => {
        const qi = +b.dataset.delq; if (cur && cur.q === L[qi].name) cur = null; L.splice(qi, 1); saveLib(L); stageSheet(); syncUI();
      }));
      sh.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
        const qi = +b.dataset.add; L[qi].stages.push(snapshot());
        if (saveLib(L)) { cur = {q: L[qi].name, s: L[qi].stages.length - 1}; toast('保存しました', 2000); stageSheet(); syncUI(); }
      });
      sh.querySelector('#qcreate').onclick = () => {
        const name = sh.querySelector('#qname').value.trim();
        if (!name) { sh.querySelector('#qname').focus(); return; }
        let q = L.find(x => x.name === name); if (!q) { q = {name, stages: []}; L.push(q); }
        q.stages.push(snapshot());
        if (saveLib(L)) { cur = {q: name, s: q.stages.length - 1}; toast('保存しました', 2000); stageSheet(); syncUI(); }
      };
      sh.querySelector('#bkOut').onclick = () => {
        const txt = JSON.stringify({app: 'monst-hojosen', v: 1, quests: loadLib()});
        openSheet(`<h3>バックアップを書き出す</h3><div class="small">この文字をメモ帳などに保存しておくと、あとで読み込めます</div>
          <textarea id="bkTxt" readonly>${esc(txt)}</textarea><button id="bkCopy" class="on">コピー</button><button id="bkBack">戻る</button>`, s2 => {
          s2.querySelector('#bkCopy').onclick = async () => {
            try { await navigator.clipboard.writeText(txt); toast('コピーしました', 2000); }
            catch (e) { const t = s2.querySelector('#bkTxt'); t.select(); toast('文字を長押ししてコピーしてください', 3000); }
          };
          s2.querySelector('#bkBack').onclick = stageSheet;
        });
      };
      sh.querySelector('#bkIn').onclick = () => {
        openSheet(`<h3>バックアップを読み込む</h3><div class="small">書き出した文字を貼り付けてください。同じ名前のクエストは置き換わります</div>
          <textarea id="bkTxt" placeholder="ここに貼り付け"></textarea><button id="bkDo" class="on">読み込む</button><button id="bkBack">戻る</button>`, s2 => {
          s2.querySelector('#bkDo').onclick = () => {
            try {
              const d = JSON.parse(s2.querySelector('#bkTxt').value);
              const qs = Array.isArray(d) ? d : d.quests; if (!Array.isArray(qs)) throw 0;
              const L2 = loadLib();
              qs.forEach(q => { if (!q || !q.name || !Array.isArray(q.stages)) return; const i = L2.findIndex(x => x.name === q.name); if (i >= 0) L2[i] = q; else L2.push(q); });
              if (saveLib(L2)) { toast(`${qs.length}件のクエストを読み込みました`, 2500); stageSheet(); }
            } catch (e) { toast('読み込めませんでした（文字が途中で切れていないか確認してください）', 3500); }
          };
          s2.querySelector('#bkBack').onclick = stageSheet;
        });
      };
      sh.querySelector('#closeS').onclick = closeSheet;
    });
  }
  $('stages').onclick = () => { closeMenu(); stageSheet(); };

  document.getElementById('ver').textContent = 'v' + VERSION;
  window.addEventListener('resize', layout);
  let savedStep = 'ball'; try { savedStep = localStorage.getItem('monst-step') || 'ball'; } catch (e) {}
  setMode('ball');
  restoreImage();
})();
</script>
</body>
</html>
