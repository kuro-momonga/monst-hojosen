<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補助線">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>反射補助線ツール</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaef; --muted:#8b93a3;
    --accent:#ffcf3f; --accent2:#4fd1ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
  body{display:flex;flex-direction:column;overflow:hidden}
  #stage{flex:1;position:relative;min-height:0;margin-top:env(safe-area-inset-top)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);
    padding:6px 12px;border-radius:999px;font-size:12px;color:#fff;pointer-events:none;white-space:nowrap}
  #panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button,.btn{appearance:none;border:1px solid var(--line);background:#222733;color:var(--text);
    border-radius:8px;padding:8px 9px;font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer;line-height:1}
  button:active{transform:scale(.97)}
  button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent}
  .seg button.on{background:var(--accent);color:#1a1a1a}
  label.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap}
  label.sl input{flex:1;min-width:0;width:60px;accent-color:var(--accent)}
  label.sl b{color:var(--text);min-width:24px;text-align:right}
  #angle{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:64px;text-align:center;font-size:15px}
  .grow{flex:1}
  input[type=file]{display:none}
  .small{font-size:11px;color:var(--muted)}
  #panel{position:relative}
  #menu{display:none;position:absolute;right:10px;bottom:calc(100% + 6px);width:230px;background:#1f232c;
    border:1px solid var(--line);border-radius:12px;padding:8px;flex-direction:column;gap:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
  #menu.open{display:flex}
  #menu button{text-align:left;width:100%;padding:11px 10px}
  #menu label.sl{padding:4px 2px}
  #fieldBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #fieldBar.show{display:flex}
  #enemyBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #enemyBar.show{display:flex}
  #enemyBar button{padding:8px 8px}
  #enemyBar .seg{background:#181b22}
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(20,22,28,.95);
    border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;
    display:none;align-items:center;gap:10px;z-index:9;white-space:nowrap}
  #toast.show{display:flex}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">引っ張って狙う／玉を長押しで移動</div>
  <div id="fieldBar"><button id="resetField">↺ 初期位置</button><button id="fieldDone" class="on">完了</button></div>
  <div id="enemyBar" class="bar"><div class="seg"><button id="shCircle" class="on">● 敵</button><button id="shRect">■ ブロック</button></div><button id="eDel">削除</button><button id="eClear">全消し</button><button id="enemyDone" class="on">完了</button></div>
</div>
<div id="panel">
  <div class="row" style="flex-wrap:nowrap;gap:5px">
    <button id="paste" title="クリップボードの画像を取り込む">📋 画像</button>
    <input id="file" type="file" accept="image/*">
    <span class="grow"></span>
    <button data-da="-1">−1°</button>
    <button data-da="-0.1">−.1</button>
    <span id="angle">0.0°</span>
    <button data-da="0.1">+.1</button>
    <button data-da="1">+1°</button>
  </div>
  <div class="row" style="flex-wrap:nowrap;gap:5px">
    <span class="small">反射</span>
    <button id="bMinus">−</button>
    <b id="bv" style="min-width:22px;text-align:center;font-size:15px">5</b>
    <button id="bPlus">＋</button>
    <span class="grow"></span>
    <button id="mEnemy">敵・壁</button>
    <button id="mArrow">矢印</button>
    <button id="pin">固定</button>
    <button id="more" title="その他">⋯</button>
  </div>
  <div id="menu">
    <button id="pickPhoto">🖼 写真から選ぶ</button>
    <button id="clearPins">固定した線を消す</button>
    <button id="detect">ブロックを自動検出</button>
    <button id="mField">枠を調整する</button>
    <button id="width">玉の通り道を表示</button>
    <button id="wobble">ブレ幅 ±0.5°</button>
    <button id="pierce">貫通タイプ</button>
    <button id="pull">タッチした方向に飛ばす</button>
    <label class="sl">玉の当たり半径 <input id="radius" type="range" min="20" max="120" value="55"><b id="rv">55</b></label>
    <div class="small" style="text-align:right" id="ver"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  const VERSION = '1.15';
  // home-screen app: reload when a newer version is deployed
  async function checkUpdate() {
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
      const {v} = await r.json();
      if (v && v !== VERSION && sessionStorage.getItem('reloadedFor') !== v) {
        sessionStorage.setItem('reloadedFor', v);
        location.replace(location.pathname + '?v=' + v);
      }
    } catch (e) {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const loupe = document.createElement('canvas');

  // ---- state (all in image-pixel coordinates) ----
  let img = null;                    // HTMLImageElement or null
  let IW = 1170, IH = 2532;          // virtual size when no image (iPhone screenshot)
  // ratio of image size. Calibrated from 2 gameplay videos (iPhone 1170x2532):
  // ball CENTER bounces at x=52..1117, y=480..1692 (wall line minus WALL_PAD).
  const DEFAULT_FIELD = {l: 40 / 1170, t: 468 / 2532, r: 1129 / 1170, b: 1704 / 2532};
  const OLD_DEFAULT = {l: .035, t: .187, r: .965, b: .676};
  const WALL_PAD = 12 / 1170;
  const GUIDE_R = 100 / 1170;
  // Block = one cell of the 8-column grid (1170/8 = 146.25px), measured from gameplay video.
  const BLOCK = 1 / 8;            // cell width / stack pitch (146.25px of 1170)
  const BLOCK_H = 169 / 1170;     // hitbox height: sprite top-8 .. sprite bottom+5 (measured)
  const blockImg = new Image(); blockImg.src = 'block.png'; blockImg.onload = () => draw();
  // blocks are 146x146 cells; when near another block, snap so they connect edge to edge
  function placeBlock(l, t, self = -1) {
    const W = BLOCK * IW, snap = W * .35;
    let best = null, bd = snap;
    S.blocks.forEach((B, k) => {
      if (k === self) return;
      for (const [cl, ct] of [[B.l - W, B.t], [B.l + W, B.t], [B.l, B.t - W], [B.l, B.t + W]]) {   // stack pitch = W
        const d = Math.hypot(cl - l, ct - t);
        if (d < bd && !S.blocks.some((o, j) => j !== self && j !== k && Math.abs(o.l - cl) < 1 && Math.abs(o.t - ct) < 1)) { bd = d; best = [cl, ct]; }
      }
    });
    if (best) [l, t] = best;
    return {l, t, r: l + W, b: t + BLOCK_H * IW};
  }

  // ---- block auto-detection (template = top face of the block sprite, normalized cross-correlation) ----
  let tplCache = null;
  function grayAt(src, sx, sy, sw, sh, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) out[i] = d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114;
    return out;
  }
  function detectBlocks() {
    if (!img || !blockImg.naturalWidth) return [];
    const k = 4 * IW / 1170;                 // work at 1/4 scale of a 1170-wide screen
    const tw = Math.round(112 / 4), th = Math.round(100 / 4);
    if (!tplCache) {
      const t = grayAt(blockImg, 12, 6, 112, 100, tw, th);
      let m = 0; t.forEach(v => m += v); m /= t.length;
      let ss = 0; for (let i = 0; i < t.length; i++) { t[i] -= m; ss += t[i] * t[i]; }
      tplCache = {t, n: Math.sqrt(ss)};
    }
    const {t, n: tn} = tplCache;
    const f = S.field, x0 = Math.max(0, f.l - 20), y0 = Math.max(0, f.t - 60);
    const W = Math.round((f.r - x0 + 20) / k), H = Math.round((f.b - y0 + 20) / k);
    const g = grayAt(img, x0, y0, W * k, H * k, W, H);
    const RW = W - tw, RH = H - th, res = new Float32Array(Math.max(0, RW * RH));
    // integral images for fast local mean/variance
    const I = new Float64Array((W + 1) * (H + 1)), I2 = new Float64Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = g[y * W + x], i = (y + 1) * (W + 1) + x + 1;
      I[i] = v + I[i - 1] + I[i - W - 1] - I[i - W - 2]; I2[i] = v * v + I2[i - 1] + I2[i - W - 1] - I2[i - W - 2];
    }
    const N = tw * th;
    for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
      const a = y * (W + 1) + x, b = a + tw, c = a + th * (W + 1), d = c + tw;
      const sum = I[d] - I[b] - I[c] + I[a], sum2 = I2[d] - I2[b] - I2[c] + I2[a];
      const vs = sum2 - sum * sum / N; if (vs < 1e-3) continue;
      let acc = 0;
      for (let j = 0; j < th; j++) { const row = (y + j) * W + x, tr = j * tw; for (let i = 0; i < tw; i++) acc += g[row + i] * t[tr + i]; }
      res[y * RW + x] = acc / (Math.sqrt(vs) * tn);
    }
    const score = (ix, iy) => {        // best score near an image-px position of the sprite-face top-left
      const cx = Math.round((ix - x0) / k), cy = Math.round((iy - y0) / k); let m = -1;
      for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++)
        if (x >= 0 && y >= 0 && x < RW && y < RH) m = Math.max(m, res[y * RW + x]);
      return m;
    };
    // peaks
    const peaks = [], r2 = res.slice();
    for (;;) {
      let bi = -1, bv = .6;
      for (let i = 0; i < r2.length; i++) if (r2[i] > bv) { bv = r2[i]; bi = i; }
      if (bi < 0) break;
      const px = bi % RW, py = (bi / RW) | 0;
      peaks.push({x: x0 + px * k, y: y0 + py * k, s: bv});
      for (let y = py - 18; y <= py + 18; y++) for (let x = px - 18; x <= px + 18; x++) if (x >= 0 && y >= 0 && x < RW && y < RH) r2[y * RW + x] = -1;
    }
    // colour check: block face is dull grey (low saturation, mid brightness) and its base is very dark
    const u = IW / 1170;
    const cc = document.createElement('canvas').getContext('2d', {willReadFrequently: true});
    const stats = (x, y, w, h) => {
      cc.canvas.width = Math.max(1, Math.round(w / 2)); cc.canvas.height = Math.max(1, Math.round(h / 2));
      cc.drawImage(img, x, y, w, h, 0, 0, cc.canvas.width, cc.canvas.height);
      const d = cc.getImageData(0, 0, cc.canvas.width, cc.canvas.height).data; let S = 0, V = 0, n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) { const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]); V += mx; S += mx ? (mx - mn) / mx * 255 : 0; }
      return {S: S / n, V: V / n};
    };
    const looksLikeBlock = q => {
      const face = stats(q.x, q.y, 112 * u, 100 * u), base = stats(q.x, q.y + 120 * u, 112 * u, 18 * u);
      return face.S < 110 && face.V < 145 && base.V < 80;
    };
    const P = BLOCK * IW, near = (a, b) => Math.abs(a - b) < 10 * IW / 1170;
    const aligned = (a, b) => (near(a.x, b.x) && Math.abs(Math.round((a.y - b.y) / P) * P - (a.y - b.y)) < 12) ||
                              (near(a.y, b.y) && Math.abs(Math.round((a.x - b.x) / P) * P - (a.x - b.x)) < 12);
    let found = peaks.filter(looksLikeBlock);
    // fill gaps inside straight runs (blocks partly hidden by enemies)
    for (const a of found.slice()) for (const b of found.slice()) {
      for (const [ax, dir] of [['x', 'y'], ['y', 'x']]) {
        if (!near(a[ax], b[ax]) || b[dir] <= a[dir]) continue;
        const steps = Math.round((b[dir] - a[dir]) / P);
        if (steps < 2 || steps > 6 || Math.abs(steps * P - (b[dir] - a[dir])) > 12) continue;
        for (let m = 1; m < steps; m++) {
          const q = {[ax]: a[ax], [dir]: a[dir] + m * (b[dir] - a[dir]) / steps};
          if (found.some(o => near(o.x, q.x) && near(o.y, q.y))) continue;
          if (score(q.x, q.y) >= .35) found.push({...q, s: 0});
        }
      }
    }
    // sprite-face top-left -> cell (face starts 5px into the sprite, sprite 5px into the cell, hitbox top 8px above sprite)
    return found.filter(q => q.y > f.t - 124 && q.y < f.b - 34)
                .map(q => { const l = q.x - 17 * IW / 1170, tt = q.y - 14 * IW / 1170; return {l, t: tt, r: l + P, b: tt + BLOCK_H * IW}; });
  }
  function runDetect(quiet) {
    const t0 = performance.now(), B = detectBlocks();
    S.blocks = B; persist(); draw();
    if (!quiet || B.length) toast(`ブロックを${B.length}個見つけました（「敵・壁」で直せます）`, 3000);
  }   // radius of the orange turn ring (measured ~97-112)
  const wallPad = () => WALL_PAD * IW;
  const S = {
    field: {l: DEFAULT_FIELD.l * IW, t: DEFAULT_FIELD.t * IH, r: DEFAULT_FIELD.r * IW, b: DEFAULT_FIELD.b * IH},
    ball: {x: IW * .5, y: IH * .64},
    r: 55,   // ball radius (blocks/enemies). Walls: center stops at x=55..1115 of 1170 = screen edge minus this radius
    enemies: [],
    blocks: [],
    wobble: 0.5,
    pierce: false,
    angle: -60,                      // degrees, 0 = right, negative = up
    bounces: 5,
    pointAim: false,   // false = Monst-style pull (default), true = touch the target direction
    showWidth: true,
    pins: []
  };
  let mode = 'aim';

  // restore light prefs
  const toRatio = () => ({
    field: {l: S.field.l / IW, t: S.field.t / IH, r: S.field.r / IW, b: S.field.b / IH},
    ball: {x: S.ball.x / IW, y: S.ball.y / IH},
    r: S.r / IW, angle: S.angle, bounces: S.bounces, pointAim: S.pointAim, showWidth: S.showWidth, pierce: S.pierce,
    enemies: S.enemies.map(e => ({x: e.x / IW, y: e.y / IH, R: e.R / IW})),
    blocks: S.blocks.map(b => ({l: b.l / IW, r: b.r / IW, t: b.t / IH, b: b.b / IH})), wobble: S.wobble
  });
  const fromRatio = R => {
    if (R.field) S.field = {l: R.field.l * IW, t: R.field.t * IH, r: R.field.r * IW, b: R.field.b * IH};
    if (R.ball) S.ball = {x: R.ball.x * IW, y: R.ball.y * IH};
    if (R.r) S.r = R.r * IW;
    ['angle', 'bounces', 'pointAim', 'showWidth', 'pierce'].forEach(k => { if (k in R) S[k] = R[k]; });
    if ('wobble' in R) S.wobble = R.wobble;
    if (Array.isArray(R.blocks)) S.blocks = R.blocks.map(b => ({l: b.l * IW, r: b.r * IW, t: b.t * IH, b: b.b * IH}));
    if (Array.isArray(R.enemies)) S.enemies = R.enemies.map(e => ({x: e.x * IW, y: e.y * IH, R: e.R * IW}));
  };
  try {
    let saved = JSON.parse(localStorage.getItem('monst-guide-v3') || 'null');
    if (!saved) { saved = JSON.parse(localStorage.getItem('monst-guide-v2') || 'null'); if (saved) delete saved.r; }
    if (saved && saved.field && ['l', 't', 'r', 'b'].every(k => Math.abs(saved.field[k] - OLD_DEFAULT[k]) < .002))
      saved.field = {...DEFAULT_FIELD};   // untouched old default -> new calibrated default
    if (saved && saved.r && (Math.abs(saved.r - 80 / 1170) < .002 || Math.abs(saved.r - 35 / 1170) < .002)) delete saved.r;   // old visual size -> measured hit radius
    if (saved) fromRatio(saved);
  } catch (e) {}
  const persist = () => { try { localStorage.setItem('monst-guide-v3', JSON.stringify(toRatio())); } catch (e) {} };

  // ---- view transform ----
  let scale = 1, ox = 0, oy = 0, dpr = 1;
  function layout() {
    dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    // aim mode: show only the field (+ small margin); field mode: whole screenshot
    let V;
    if (mode === 'field') V = {x: 0, y: 0, w: IW, h: IH};
    else {
      const f = S.field, m = Math.max(S.r * .7, IW * .015);
      V = {x: f.l - m, y: f.t - m, w: f.r - f.l + 2 * m, h: f.b - f.t + 2 * m};
    }
    scale = Math.min(w / V.w, h / V.h);
    ox = (w - V.w * scale) / 2 - V.x * scale;
    oy = (h - V.h * scale) / 2 - V.y * scale;
    draw();
  }
  const toS = (x, y) => [ox + x * scale, oy + y * scale];
  const toI = (sx, sy) => [(sx - ox) / scale, (sy - oy) / scale];

  // ---- reflection ----
  // returns points; pts.hits = indices of enemies touched, pts.kinds[i] = 'w' | 'e' for each bounce
  function trace(bx, by, angDeg, pad, n) {
    const f = S.field;
    const xmin = f.l + pad, xmax = f.r - pad, ymin = f.t + pad, ymax = f.b - pad;
    const pts = [[bx, by]]; pts.hits = new Set(); pts.kinds = [];
    if (xmin >= xmax || ymin >= ymax) return pts;
    let x = bx, y = by;
    const a = angDeg * Math.PI / 180;
    let dx = Math.cos(a), dy = Math.sin(a);
    const E = S.enemies, rb = S.r;
    for (let i = 0; i <= n; i++) {
      const tx = dx > 1e-9 ? (xmax - x) / dx : dx < -1e-9 ? (xmin - x) / dx : Infinity;
      const ty = dy > 1e-9 ? (ymax - y) / dy : dy < -1e-9 ? (ymin - y) / dy : Infinity;
      let t = Math.max(0, Math.min(tx, ty)), hitE = -1;
      if (!S.pierce) {
        E.forEach((e, k) => {
          const R = e.R + rb, fx = x - e.x, fy = y - e.y;
          const c = fx * fx + fy * fy - R * R;
          if (c <= 0) return;                       // starting inside: ignore
          const bq = fx * dx + fy * dy;
          if (bq >= 0) return;                      // moving away
          const disc = bq * bq - c;
          if (disc < 0) return;
          const th = -bq - Math.sqrt(disc);
          if (th > 1e-6 && th < t) { t = th; hitE = k; }
        });
      }
      let hitB = -1, flipX = false, flipY = false;
      S.blocks.forEach((B, k) => {
        const rb2 = S.r, l = Math.min(B.l, B.r) - rb2, r = Math.max(B.l, B.r) + rb2, tp = Math.min(B.t, B.b) - rb2, bt = Math.max(B.t, B.b) + rb2;
        if (x > l && x < r && y > tp && y < bt) return;       // starting inside: ignore
        let txn, txf, tyn, tyf;
        if (Math.abs(dx) < 1e-9) { if (x <= l || x >= r) return; txn = -Infinity; txf = Infinity; }
        else { const a1 = (l - x) / dx, a2 = (r - x) / dx; txn = Math.min(a1, a2); txf = Math.max(a1, a2); }
        if (Math.abs(dy) < 1e-9) { if (y <= tp || y >= bt) return; tyn = -Infinity; tyf = Infinity; }
        else { const b1 = (tp - y) / dy, b2 = (bt - y) / dy; tyn = Math.min(b1, b2); tyf = Math.max(b1, b2); }
        const ten = Math.max(txn, tyn), tex = Math.min(txf, tyf);
        if (ten < tex && ten > 1e-6 && ten < t) {

      x += dx * t; y += dy * t;
      if (S.pierce) E.forEach((e, k) => {               // pass-through: mark every enemy the segment touches
        const sx = x - x0, sy = y - y0, L2 = sx * sx + sy * sy || 1;

  }

  // ---- drawing ----
  // segment colors: shot → after 1st bounce → after 2nd …
  const SEG = ['#ffffff', '#ffd43b', '#ff4d4d', '#3da5ff', '#3ddc84', '#d36bff', '#ff8c1a', '#00e5e5'];
  const segColor = i => SEG[i % SEG.length];

  const polyline = sp => { ctx.beginPath(); sp.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); };

  // pinned lines: dashed, single color, faint
  function drawPinned(pts) {
    const sp = pts.map(p => toS(p[0], p[1]));
    ctx.save();
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.setLineDash([7, 6]);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4; polyline(sp); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; polyline(sp); ctx.stroke();
    ctx.restore();
  }

  // current line: each segment in its own color, bounce points numbered in the color that follows
  function drawPath(pts) {
    const sp = pts.map(p => toS(p[0], p[1]));
    ctx.save();
    if (mode === 'arrow') ctx.globalAlpha = .28;   // keep the background visible while looking for a landmark
    ctx.lineJoin = ctx.lineCap = 'round';
    if (S.showWidth) {
      ctx.globalAlpha = .16; ctx.lineWidth = S.r * 2 * scale;
      for (let i = 0; i < sp.length - 1; i++) {
        ctx.strokeStyle = segColor(i); polyline([sp[i], sp[i + 1]]); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < sp.length - 1; i++) {
      ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 6.5; polyline([sp[i], sp[i + 1]]); ctx.stroke();
    }
    for (let i = 0; i < sp.length - 1; i++) {
      ctx.strokeStyle = segColor(i); ctx.lineWidth = 3.5; polyline([sp[i], sp[i + 1]]); ctx.stroke();
    }
    // bounce markers
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 1; i < sp.length - 1; i++) {
      const [x, y] = sp[i];
      ctx.fillStyle = (pts.kinds && pts.kinds[i - 1] === 'e') ? '#ff4d88' : '#111';
      ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = segColor(i); ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillText(i, x, y + .5);
    }
    // arrow on first segment
    if (sp.length > 1) {
      const [x0, y0] = sp[0], [x1, y1] = sp[1];
      const L = Math.hypot(x1 - x0, y1 - y0);
      if (L > 30) {
        const ux = (x1 - x0) / L, uy = (y1 - y0) / L;
        const ax = x0 + ux * Math.min(L * .5, 90), ay = y0 + uy * Math.min(L * .5, 90);
        ctx.fillStyle = segColor(0); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(ax + ux * 11, ay + uy * 11);

        ctx.closePath(); ctx.stroke(); ctx.fill();

    ctx.restore();
  }

  let dragInfo = null;

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const [x0, y0] = toS(0, 0);
    if (img) {
      ctx.drawImage(img, x0, y0, IW * scale, IH * scale);
    } else {
      ctx.fillStyle = '#151922'; ctx.fillRect(x0, y0, IW * scale, IH * scale);
      ctx.strokeStyle = '#1f2531'; ctx.lineWidth = 1;
      for (let gx = 0; gx <= IW; gx += 90) { const [a] = toS(gx, 0); ctx.beginPath(); ctx.moveTo(a, y0); ctx.lineTo(a, y0 + IH * scale); ctx.stroke(); }
      for (let gy = 0; gy <= IH; gy += 90) { const [, b] = toS(0, gy); ctx.beginPath(); ctx.moveTo(x0, b); ctx.lineTo(x0 + IW * scale, b); ctx.stroke(); }
      ctx.fillStyle = '#5b6475'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('スクショを「コピー」→「📋 画像」で読み込み', w / 2, y0 + 200 * scale);
    }

    // field
    const f = S.field;
    const [fl, ft] = toS(f.l, f.t), [fr, fb] = toS(f.r, f.b);
    ctx.save();
    ctx.fillStyle = mode === 'field' ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.65)';
    ctx.beginPath(); ctx.rect(x0, y0, IW * scale, IH * scale); ctx.rect(fl, ft, fr - fl, fb - ft); ctx.fill('evenodd');
    ctx.strokeStyle = mode === 'field' ? '#ff6b6b' : 'rgba(255,255,255,.55)';
    ctx.lineWidth = mode === 'field' ? 2.5 : 1.5;
    ctx.setLineDash(mode === 'field' ? [] : [6, 5]);
    ctx.strokeRect(fl, ft, fr - fl, fb - ft);
    if (mode === 'field') {
      ctx.fillStyle = '#ff6b6b';
      [[fl, ft], [fr, ft], [fl, fb], [fr, fb], [(fl + fr) / 2, ft], [(fl + fr) / 2, fb], [fl, (ft + fb) / 2], [fr, (ft + fb) / 2]]
        .forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.restore();

    // pinned
    S.pins.forEach(p => drawPinned(trace(p.x, p.y, p.angle, wallPad(), p.bounces)));

    // current
    const pts = trace(S.ball.x, S.ball.y, S.angle, wallPad(), S.bounces);
    drawBlocks();
    drawEnemies(pts.hits);
    if (S.wobble > 0) [-S.wobble, S.wobble].forEach(w => drawWobble(trace(S.ball.x, S.ball.y, S.angle + w, wallPad(), S.bounces)));
    drawPath(pts);

    // ball
    const [bx, by] = toS(S.ball.x, S.ball.y);
    ctx.save();
    // guide circle = size of the turn ring around the character (align this to the character)
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(bx, by, GUIDE_R * IW * scale, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,207,63,.22)'; ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, S.r * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx - 10, by); ctx.lineTo(bx + 10, by); ctx.moveTo(bx, by - 10); ctx.lineTo(bx, by + 10); ctx.stroke();
    ctx.restore();

    // pull indicator (Monst-style): from touch start to finger

      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(dragInfo.sx0, dragInfo.sy0); ctx.lineTo(dragInfo.sx, dragInfo.sy); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.arc(dragInfo.sx0, dragInfo.sy0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

      ctx.save(); ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(bx, by, Math.max(S.r * scale, 14) + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    if (mode === 'arrow') drawArrowMode(pts);
    else if (dragInfo && dragInfo.kind !== 'pull' && dragInfo.kind !== 'pending') drawLoupe(dragInfo.sx, dragInfo.sy);

    document.getElementById('angle').textContent = displayAngle() + '°';
  }

  function displayAngle() {
    // 0° = straight up, clockwise positive (−180〜180)
    let a = S.angle + 90;
    a = ((a + 180) % 360 + 360) % 360 - 180;
    return a.toFixed(1);
  }

  // ---- arrow mode: Monst-style arrow on the first segment, tip slides along the line ----
  let tipD = null;   // distance from ball to arrow tip (image px)
  function firstLen(pts) { return pts.length > 1 ? Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]) : 0; }
  function maxTip() {   // straight line from the ball until it leaves the screenshot
    const a = S.angle * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
    const tx = dx > 1e-9 ? (IW - S.ball.x) / dx : dx < -1e-9 ? -S.ball.x / dx : Infinity;
    const ty = dy > 1e-9 ? (IH - S.ball.y) / dy : dy < -1e-9 ? -S.ball.y / dy : Infinity;
    return Math.min(tx, ty);
  }
  function tipPoint(pts) {
    const L = firstLen(pts), a = S.angle * Math.PI / 180;
    if (tipD == null) tipD = Math.min(L * .6, 520 / 1170 * IW);
    const d = Math.max(S.r * 1.2, Math.min(tipD, maxTip()));
    return [S.ball.x + Math.cos(a) * d, S.ball.y + Math.sin(a) * d];
  }
  function drawArrowMode(pts) {
    const [tx, ty] = tipPoint(pts), [stx, sty] = toS(tx, ty), [bx, by] = toS(S.ball.x, S.ball.y);
    const a = S.angle * Math.PI / 180, nx = -Math.sin(a), ny = Math.cos(a), hw = 42 / 1170 * IW * scale;
    ctx.save();
    // the first line extended straight past the bounce point
    const ml = maxTip(), [ex, ey] = toS(S.ball.x + Math.cos(a) * ml, S.ball.y + Math.sin(a) * ml);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(stx, sty);
    ctx.lineTo(bx + nx * hw, by + ny * hw); ctx.lineTo(bx - nx * hw, by - ny * hw); ctx.closePath();
    const g = ctx.createLinearGradient(bx, by, stx, sty);

    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(160,210,255,.9)'; ctx.lineWidth = 1.5; ctx.stroke();
    // tip marker
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stx, sty, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(stx - 16, sty); ctx.lineTo(stx + 16, sty); ctx.moveTo(stx, sty - 16); ctx.lineTo(stx, sty + 16); ctx.stroke();
    ctx.restore();
    // background loupe at the tip (raw screenshot, no overlays)
    if (!img) return;
    const size = 160, zoom = 2.5, src = size / zoom / scale;   // image px shown
    const w = cv.clientWidth, lx = stx < w / 2 ? w - size - 10 : 10, ly = 10;
    ctx.save();
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, tx - src / 2, ty - src / 2, src, src, lx, ly, size, size);
    // the shot line through the loupe
    const k = size / src, cx = lx + size / 2, cy = ly + size / 2;
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * size, cy - Math.sin(a) * size); ctx.lineTo(cx + Math.cos(a) * size, cy + Math.sin(a) * size); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

  function drawLoupe(sx, sy) {
    const size = 120, zoom = 3;
    const src = size / zoom;
    loupe.width = size * dpr; loupe.height = size * dpr;
    const lc = loupe.getContext('2d');
    lc.imageSmoothingEnabled = false;
    lc.drawImage(cv, (sx - src / 2) * dpr, (sy - src / 2) * dpr, src * dpr, src * dpr, 0, 0, size * dpr, size * dpr);
    const w = cv.clientWidth;
    const lx = sx < w / 2 ? w - size - 10 : 10, ly = 10;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(loupe, lx, ly, size, size);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx + size / 2 - 8, ly + size / 2); ctx.lineTo(lx + size / 2 + 8, ly + size / 2);
    ctx.moveTo(lx + size / 2, ly + size / 2 - 8); ctx.lineTo(lx + size / 2, ly + size / 2 + 8); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

  function drawWobble(pts) {
    const sp = pts.map(p => toS(p[0], p[1]));
    ctx.save(); ctx.lineJoin = ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3.5; polyline(sp); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 4]); polyline(sp); ctx.stroke();
    ctx.restore();
  }

  function drawBlocks() {
    ctx.save();
    // draw top rows first so lower blocks overlap the base of the ones above (like the game)
    S.blocks.map((B, k) => [B, k]).sort((a, b) => a[0].t - b[0].t).forEach(([B, k]) => {
      const [x1, y1] = toS(B.l, B.t), [x2, y2] = toS(B.r, B.b), w = x2 - x1, h = y2 - y1;
      const sel = mode === 'enemy' && k === selBlock;
      if (blockImg.complete && blockImg.naturalWidth) {
        // sprite: 136x156 drawn inside the 146 cell (5px margin, base shadow hangs below)
        const sc = w / 146.25;
        ctx.globalAlpha = .9;
        ctx.drawImage(blockImg, x1 + 5 * sc, y1 + 8 * sc, 136 * sc, 156 * sc);
        ctx.globalAlpha = 1;
      } else { ctx.fillStyle = 'rgba(120,200,255,.2)'; ctx.fillRect(x1, y1, w, h); }
      ctx.setLineDash(sel ? [6, 4] : [3, 4]); ctx.lineWidth = sel ? 2.5 : 1.2;
      ctx.strokeStyle = sel ? '#78c8ff' : 'rgba(120,200,255,.8)'; ctx.strokeRect(x1, y1, w, h); ctx.setLineDash([]);
    });
    ctx.restore();
  }

  function drawEnemies(hits) {
    ctx.save();
    S.enemies.forEach((e, k) => {
      const [x, y] = toS(e.x, e.y), R = e.R * scale, hit = hits.has(k), sel = mode === 'enemy' && k === selEnemy;
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
      ctx.fillStyle = hit ? 'rgba(255,70,120,.32)' : 'rgba(255,70,120,.10)'; ctx.fill();
      ctx.setLineDash(sel ? [6, 4] : []);
      ctx.lineWidth = hit || sel ? 3 : 2; ctx.strokeStyle = hit ? '#ff4d88' : 'rgba(255,120,160,.85)'; ctx.stroke();
      ctx.setLineDash([]);
      if (mode === 'enemy') {
        ctx.fillStyle = '#ff4d88';
        ctx.beginPath(); ctx.arc(x + R, y, 7, 0, Math.PI * 2); ctx.fill();   // resize handle
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();
  }

  function moveTip(sx, sy) {
    const [ix, iy] = toI(sx, sy), a = S.angle * Math.PI / 180;
    tipD = (ix - S.ball.x) * Math.cos(a) + (iy - S.ball.y) * Math.sin(a);   // project onto the shot line
    tipD = Math.max(S.r * 1.2, Math.min(tipD, maxTip()));
  }

  // ball center may go a little past the frame line
  function clampBall() {
    const f = S.field, k = wallPad();
    S.ball.x = Math.min(Math.max(S.ball.x, f.l + k), f.r - k);
    S.ball.y = Math.min(Math.max(S.ball.y, f.t + k), f.b - k);
  }

  // ---- input ----
  function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  function setAimFrom(sx, sy) {
    const [ix, iy] = toI(sx, sy);
    const bx = S.ball.x, by = S.ball.y;
    let dx = ix - bx, dy = iy - by;
    if (Math.hypot(dx, dy) < 2) return;
    S.angle = Math.atan2(dy, dx) * 180 / Math.PI;
  }

  let selEnemy = -1, selBlock = -1, lastEnemyR = 95 / 1170 * IW, editShape = 'circle';
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    const [sx, sy] = pos(e);
    if (mode === 'arrow') {
      dragInfo = {kind: 'tip', sx, sy}; moveTip(sx, sy); hint.style.display = 'none'; draw(); return;
    }
    if (mode === 'enemy') {
      const [ix, iy] = toI(sx, sy);
      // blocks: fixed-size stamps (same size in every stage). Tap inside = move, tap empty (block tool) = place
      for (let i = S.blocks.length - 1; i >= 0; i--) {
        const B = S.blocks[i];
        if (ix > B.l && ix < B.r && iy > B.t && iy < B.b && (editShape === 'rect' || true)) {
          selBlock = i; selEnemy = -1;
          dragInfo = {kind: 'block', k: i, off: [B.l - ix, B.t - iy], sx, sy}; hint.style.display = 'none'; draw(); return;
        }
      }
      if (editShape === 'rect') {
        const W = BLOCK * IW;
        S.blocks.push(placeBlock(ix - W / 2, iy - W / 2)); selBlock = S.blocks.length - 1; selEnemy = -1;
        dragInfo = {kind: 'block', k: selBlock, off: [-W / 2, -W / 2], sx, sy}; hint.style.display = 'none'; draw(); return;
      }
      selBlock = -1;
      let k = -1, how = '';
      // resize handle / ring first, then inside (topmost = last)
      for (let i = S.enemies.length - 1; i >= 0; i--) {
        const en = S.enemies[i], [ex, ey] = toS(en.x, en.y), R = en.R * scale, d = Math.hypot(sx - ex, sy - ey);
        if (Math.hypot(sx - (ex + R), sy - ey) < 22 || Math.abs(d - R) < 14) { k = i; how = 'resize'; break; }
        if (d < R) { k = i; how = 'move'; break; }
      }
      if (k < 0) {
        S.enemies.push({x: ix, y: iy, R: lastEnemyR}); k = S.enemies.length - 1; how = 'new';
      }
      selEnemy = k;
      const en = S.enemies[k];
      dragInfo = {kind: 'enemy', how, k, off: [en.x - ix, en.y - iy], sx, sy, sx0: sx, sy0: sy};
      hint.style.display = 'none';
      draw(); return;
    }
    if (mode === 'field') {
      const f = S.field; const [fl, ft] = toS(f.l, f.t), [fr, fb] = toS(f.r, f.b);
      const tol = 26;
      const edges = {
        l: Math.abs(sx - fl) < tol && sy > ft - tol && sy < fb + tol,
        r: Math.abs(sx - fr) < tol && sy > ft - tol && sy < fb + tol,
        t: Math.abs(sy - ft) < tol && sx > fl - tol && sx < fr + tol,
        b: Math.abs(sy - fb) < tol && sx > fl - tol && sx < fr + tol,
      };
      const sel = Object.keys(edges).filter(k => edges[k]);

      else if (sx > fl && sx < fr && sy > ft && sy < fb) {

      }

      const [bx, by] = toS(S.ball.x, S.ball.y);
      const hitR = Math.max(S.r * scale, 26);
      const [ix, iy] = toI(sx, sy);
      const onBall = Math.hypot(sx - bx, sy - by) < hitR;
      if (S.pointAim) {
        if (onBall) dragInfo = {kind: 'ball', off: [S.ball.x - ix, S.ball.y - iy], sx, sy};
        else { dragInfo = {kind: 'aim', sx, sy}; setAimFrom(sx, sy); }
      } else {
        // Monst-style: drag anywhere = pull. Long-press on the ball = move the ball.
        dragInfo = {kind: onBall ? 'pending' : 'pull', sx, sy, sx0: sx, sy0: sy, off: [S.ball.x - ix, S.ball.y - iy]};
        if (onBall) {
          const d = dragInfo;
          d.timer = setTimeout(() => { if (dragInfo === d && d.kind === 'pending') { d.kind = 'ball'; draw(); } }, 350);
        }
      }
    }
    hint.style.display = 'none';
    draw();
  });

  cv.addEventListener('pointermove', e => {
    if (!dragInfo) return;
    const [sx, sy] = pos(e);
    dragInfo.sx = sx; dragInfo.sy = sy;
    const [ix, iy] = toI(sx, sy);
    if (dragInfo.kind === 'tip') {
      moveTip(sx, sy);
    } else if (dragInfo.kind === 'block') {
      S.blocks[dragInfo.k] = placeBlock(ix + dragInfo.off[0], iy + dragInfo.off[1], dragInfo.k);
    } else if (dragInfo.kind === 'enemy') {
      const en = S.enemies[dragInfo.k];
      if (dragInfo.how === 'move') { en.x = ix + dragInfo.off[0]; en.y = iy + dragInfo.off[1]; }
      else if (dragInfo.how === 'resize' || Math.hypot(sx - dragInfo.sx0, sy - dragInfo.sy0) > 12) {
        en.R = Math.max(15, Math.hypot(ix - en.x, iy - en.y)); lastEnemyR = en.R;
      }
    } else if (dragInfo.kind === 'ball') {
      S.ball.x = ix + dragInfo.off[0]; S.ball.y = iy + dragInfo.off[1]; clampBall();
    } else if (dragInfo.kind === 'aim') {
      setAimFrom(sx, sy);
    } else if (dragInfo.kind === 'pending' || dragInfo.kind === 'pull') {
      const vx = dragInfo.sx0 - sx, vy = dragInfo.sy0 - sy;
      if (dragInfo.kind === 'pending' && Math.hypot(vx, vy) > 10) { clearTimeout(dragInfo.timer); dragInfo.kind = 'pull'; }
      if (dragInfo.kind === 'pull' && Math.hypot(vx, vy) > 10) S.angle = Math.atan2(vy, vx) * 180 / Math.PI;
    } else if (dragInfo.kind === 'field') {
      const f = S.field, min = 40;
      for (const k of dragInfo.edges) {
        if (k === 'l') f.l = Math.min(ix, f.r - min);
        if (k === 'r') f.r = Math.max(ix, f.l + min);
        if (k === 't') f.t = Math.min(iy, f.b - min);
        if (k === 'b') f.b = Math.max(iy, f.t + min);
      }
    } else if (dragInfo.kind === 'fieldMove') {
      const dx = ix - dragInfo.start[0], dy = iy - dragInfo.start[1], o = dragInfo.orig;
      Object.assign(S.field, {l: o.l + dx, r: o.r + dx, t: o.t + dy, b: o.b + dy});
    }
    draw();
  });

  const end = () => {
    if (!dragInfo) return;
    clearTimeout(dragInfo.timer);

    dragInfo = null; clampBall(); persist(); draw();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  // ---- controls ----
  const $ = id => document.getElementById(id);
  const menu = $('menu');
  const closeMenu = () => menu.classList.remove('open');
  $('more').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('pointerdown', e => {
    if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== $('more')) closeMenu();
  });

  function setMode(m) {
    mode = m;
    $('fieldBar').classList.toggle('show', m === 'field');
    $('enemyBar').classList.toggle('show', m === 'enemy');
    $('mEnemy').classList.toggle('on', m === 'enemy');
    $('mArrow').classList.toggle('on', m === 'arrow');
    if (m !== 'enemy') { selEnemy = -1; selBlock = -1; }
    hint.style.display = '';
    hint.textContent = m === 'aim' ? (S.pointAim ? '玉をドラッグで移動／それ以外をタッチで方向' : '引っ張って狙う／玉を長押しで移動')
                     : m === 'arrow' ? '角度は固定。線の上をなぞって、矢印の先に合う目印を探す'
                     : m === 'enemy' ? (editShape === 'rect' ? 'タップでブロックを置く／ドラッグで移動（近くのブロックにくっつく）' : 'タップで敵を置く・引っ張って大きさ／丸の中で移動・ふちで大きさ')
                     : '赤枠の辺・角をドラッグで調整';
    layout();
  }
  $('mField').onclick = () => { closeMenu(); setMode('field'); };
  $('fieldDone').onclick = () => setMode('aim');
  $('mEnemy').onclick = () => setMode(mode === 'enemy' ? 'aim' : 'enemy');
  $('mArrow').onclick = () => setMode(mode === 'arrow' ? 'aim' : 'arrow');
  $('enemyDone').onclick = () => setMode('aim');
  $('eDel').onclick = () => {
    if (selEnemy >= 0) S.enemies.splice(selEnemy, 1);
    else if (selBlock >= 0) S.blocks.splice(selBlock, 1);
    selEnemy = selBlock = -1; persist(); draw();
  };
  $('eClear').onclick = () => { S.enemies = []; S.blocks = []; selEnemy = selBlock = -1; persist(); draw(); };
  const setShape = sh => { editShape = sh; $('shCircle').classList.toggle('on', sh === 'circle'); $('shRect').classList.toggle('on', sh === 'rect'); setMode('enemy'); };
  $('shCircle').onclick = () => setShape('circle');
  $('shRect').onclick = () => setShape('rect');
  $('wobble').onclick = () => { S.wobble = S.wobble === 0 ? 0.5 : S.wobble === 0.5 ? 1 : 0; syncUI(); persist(); draw(); };
  $('pierce').onclick = () => { S.pierce = !S.pierce; syncUI(); persist(); draw(); };
  $('resetField').onclick = () => {
    S.field = {l: DEFAULT_FIELD.l * IW, t: DEFAULT_FIELD.t * IH, r: DEFAULT_FIELD.r * IW, b: DEFAULT_FIELD.b * IH};
    persist(); layout();
  };

  document.querySelectorAll('[data-da]').forEach(b => {
    b.onclick = () => { S.angle += parseFloat(b.dataset.da); persist(); draw(); };
  });

  const syncUI = () => {
    $('bv').textContent = S.bounces;
    $('radius').value = Math.round(S.r); $('rv').textContent = Math.round(S.r);
    $('pull').classList.toggle('on', S.pointAim);
    $('pierce').classList.toggle('on', S.pierce);
    $('wobble').textContent = S.wobble ? `ブレ幅 ±${S.wobble}°` : 'ブレ幅 なし';
    $('wobble').classList.toggle('on', S.wobble > 0);
    $('width').classList.toggle('on', S.showWidth);
  };
  const setBounces = n => { S.bounces = Math.max(1, Math.min(20, n)); syncUI(); persist(); draw(); };
  $('bMinus').onclick = () => setBounces(S.bounces - 1);
  $('bPlus').onclick = () => setBounces(S.bounces + 1);
  $('radius').oninput = e => { S.r = +e.target.value; $('rv').textContent = S.r; clampBall(); persist(); layout(); };
  $('pull').onclick = () => { S.pointAim = !S.pointAim; syncUI(); persist(); setMode('aim'); };
  $('width').onclick = () => { S.showWidth = !S.showWidth; syncUI(); persist(); draw(); };
  $('pin').onclick = () => { S.pins.push({x: S.ball.x, y: S.ball.y, angle: S.angle, r: S.r, bounces: S.bounces}); draw(); };
  $('clearPins').onclick = () => { S.pins = []; closeMenu(); draw(); };
  $('detect').onclick = () => { closeMenu(); runDetect(false); };

  // toast
  let toastTimer;
  function toast(html, ms = 4000) {
    const t = $('toast'); t.innerHTML = html; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
    const b = t.querySelector('button'); if (b) b.onclick = () => { t.classList.remove('show'); $('file').click(); };
  }

  // 📋 画像: read the latest copied image (screenshot → コピーして削除)
  $('paste').onclick = async () => {
    try {
      if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('unsupported');
      const items = await navigator.clipboard.read();
      for (const it of items) {
        const type = it.types.find(t => t.startsWith('image/'));
        if (type) { const blob = await it.getType(type); loadFile(new File([blob], 'clip', {type})); return; }
      }
      toast('コピーされた画像がありません <button>写真から選ぶ</button>');
    } catch (e) {
      toast('画像を読み込めませんでした <button>写真から選ぶ</button>');
    }
  };
  $('pickPhoto').onclick = () => { closeMenu(); $('file').click(); };

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const R = toRatio();               // frame stays fixed (kept as ratio of screen size)
      img = im; IW = im.naturalWidth; IH = im.naturalHeight;
      fromRatio(R);
      $('radius').max = Math.round(IW / 6);
      S.pins = [];
      syncUI();
      setMode('aim');
      setTimeout(() => runDetect(true), 30);
    };
    im.src = url;
  }
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  window.addEventListener('paste', e => {
    const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (it) loadFile(it.getAsFile());
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

  document.getElementById('ver').textContent = 'v' + VERSION;
  window.addEventListener('resize', layout);
  syncUI();
  layout();
})();
</script>
</body>
</html>
