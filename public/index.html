<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補助線">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>反射補助線ツール</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaef; --muted:#8b93a3;
    --accent:#ffcf3f; --accent2:#4fd1ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
  body{display:flex;flex-direction:column;overflow:hidden}
  #stage{flex:1;position:relative;min-height:0;margin-top:env(safe-area-inset-top)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);
    padding:6px 12px;border-radius:999px;font-size:12px;color:#fff;pointer-events:none;white-space:nowrap}
  #panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button,.btn{appearance:none;border:1px solid var(--line);background:#222733;color:var(--text);
    border-radius:8px;padding:8px 9px;font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer;line-height:1}
  button:active{transform:scale(.97)}
  button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent}
  .seg button.on{background:var(--accent);color:#1a1a1a}
  label.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap}
  label.sl input{flex:1;min-width:0;width:60px;accent-color:var(--accent)}
  label.sl b{color:var(--text);min-width:24px;text-align:right}
  #angle{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:64px;text-align:center;font-size:15px}
  .grow{flex:1}
  input[type=file]{display:none}
  .small{font-size:11px;color:var(--muted)}
  #panel{position:relative}
  #menu{display:none;position:absolute;right:10px;bottom:calc(100% + 6px);width:230px;background:#1f232c;
    border:1px solid var(--line);border-radius:12px;padding:8px;flex-direction:column;gap:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
  #menu.open{display:flex}
  #menu button{text-align:left;width:100%;padding:11px 10px}
  #menu label.sl{padding:4px 2px}
  #fieldBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #fieldBar.show{display:flex}
  #enemyBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #enemyBar.show{display:flex}
  #enemyBar button{padding:8px 8px}
  #enemyBar .seg{background:#181b22}
  #toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,22,28,.95);
    border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;
    display:none;align-items:center;gap:10px;z-index:9;white-space:nowrap}
  #toast.show{display:flex}
  #tabs{display:flex;gap:4px;flex:1}
  #tabs button{flex:1;padding:9px 4px;background:#1c2029}
  #tabs button.on{background:var(--accent);color:#1a1a1a}
  .stepRow{display:none;gap:6px;align-items:center;flex-wrap:nowrap}
  .stepRow.show{display:flex}
  .next{background:#2d3b55;border-color:#3d5378}
  #pad{height:86px;border:1px dashed #3a4252;border-radius:12px;background:repeating-linear-gradient(45deg,#1a1e26,#1a1e26 6px,#1c2129 6px,#1c2129 12px);
    touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;user-select:none;-webkit-user-select:none}
  #pad.active{border-color:var(--accent);color:var(--text)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;align-items:flex-end;justify-content:center}
  #modal.show{display:flex}
  #sheet{background:#1b1f27;border-top-left-radius:16px;border-top-right-radius:16px;width:100%;max-width:520px;max-height:85%;overflow:auto;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  #sheet h3{margin:2px 0 4px;font-size:16px}
  #sheet .q{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #sheet .qh{display:flex;align-items:center;gap:6px}
  #sheet .qh b{flex:1;font-size:14px}
  #sheet .st{display:flex;align-items:center;gap:6px;padding-left:6px}
  #sheet .st span{flex:1;color:var(--muted)}
  #sheet input[type=text],#sheet textarea{width:100%;background:#11141a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px}
  #sheet textarea{height:120px;font-size:11px}
  .danger{color:#ff8a8a}
  #stageLabel{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint"></div>
  <div id="stageLabel"></div>
  <div id="fieldBar"><button id="resetField">↺ 初期位置</button><button id="fieldDone" class="on">完了</button></div>
</div>
<div id="panel">
  <div class="row" style="flex-wrap:nowrap;gap:5px">
    <button id="btnImg">🖼 画像</button>
    <input id="file" type="file" accept="image/*">
    <div id="tabs"><button data-step="ball">① 玉</button><button data-step="place">② 配置</button><button data-step="aim">③ 狙う</button></div>
    <button id="more" title="その他">⋯</button>
  </div>
  <div class="stepRow" id="row-ball">
    <span class="small grow">打つキャラをタップ → 自動で輪に合わせます。ずれたらパッドで微調整</span>
    <button class="next" data-go="place">次へ ▶</button>
  </div>
  <div class="stepRow" id="row-place">
    <div class="seg"><button id="shCircle" class="on">● 敵</button><button id="shRect">■ ブロック</button></div>
    <button id="szMinus" title="敵を小さく">−</button><button id="szPlus" title="敵を大きく">＋</button>
    <button id="eDel">削除</button>
    <span class="grow"></span>
    <button class="next" data-go="aim">次へ ▶</button>
  </div>
  <div class="stepRow" id="row-aim">
    <button data-da="-1">−1°</button>
    <button data-da="-0.1">−.1</button>
    <span id="angle">0.0°</span>
    <button data-da="0.1">+.1</button>
    <button data-da="1">+1°</button>
  </div>
  <div class="stepRow" id="row-aim2">
    <span class="small">反射</span>
    <button id="bMinus">−</button>
    <b id="bv" style="min-width:22px;text-align:center;font-size:15px">5</b>
    <button id="bPlus">＋</button>
    <span class="grow"></span>
    <button id="mArrow">矢印</button>
    <button id="pin">固定</button>
  </div>
  <div id="pad">パッド</div>
  <div id="menu">
    <button id="stages">📁 ステージ保存・読み込み</button>
    <button id="dim">画面：通常</button>
    <button id="detect">敵・ブロックを自動検出</button>
    <button id="eClear" class="danger">敵とブロックを全部消す</button>
    <button id="clearPins">固定した線を消す</button>
    <button id="mField">枠を調整する</button>
    <button id="width">玉の通り道を表示</button>
    <button id="wobble">ブレ幅 ±0.5°</button>
    <button id="pierce">貫通タイプ</button>
    <button id="pull">タッチした方向に飛ばす</button>
    <label class="sl">玉の当たり半径 <input id="radius" type="range" min="20" max="120" value="55"><b id="rv">55</b></label>
    <div class="small" style="text-align:right" id="ver"></div>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
(() => {
  const VERSION = '2.3';
  // home-screen app: reload when a newer version is deployed
  async function checkUpdate() {
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
      const {v} = await r.json();
      if (v && v !== VERSION && sessionStorage.getItem('reloadedFor') !== v) {
        sessionStorage.setItem('reloadedFor', v);
        location.replace(location.pathname + '?v=' + v);
      }
    } catch (e) {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const loupe = document.createElement('canvas');

  // ---- state (all in image-pixel coordinates) ----
  let img = null;                    // HTMLImageElement or null
  let IW = 1170, IH = 2532;          // virtual size when no image (iPhone screenshot)
  // ratio of image size. Calibrated from 2 gameplay videos (iPhone 1170x2532):
  // ball CENTER bounces at x=52..1117, y=480..1692 (wall line minus WALL_PAD).
  const DEFAULT_FIELD = {l: 40 / 1170, t: 468 / 2532, r: 1129 / 1170, b: 1704 / 2532};
  const OLD_DEFAULT = {l: .035, t: .187, r: .965, b: .676};
  const WALL_PAD = 12 / 1170;
  const GUIDE_R = 100 / 1170;
  // Block = one cell of the 8-column grid (1170/8 = 146.25px), measured from gameplay video.
  const BLOCK = 1 / 8;            // cell width / stack pitch (146.25px of 1170)
  const BLOCK_H = 169 / 1170;     // hitbox height: sprite top-8 .. sprite bottom+5 (measured)
  const blockImg = new Image(); blockImg.src = 'block.png'; blockImg.onload = () => draw();
  // blocks are 146x146 cells; when near another block, snap so they connect edge to edge
  function placeBlock(l, t, self = -1) {
    const W = BLOCK * IW, snap = W * .35;
    let best = null, bd = snap;
    S.blocks.forEach((B, k) => {
      if (k === self) return;
      for (const [cl, ct] of [[B.l - W, B.t], [B.l + W, B.t], [B.l, B.t - W], [B.l, B.t + W]]) {   // stack pitch = W
        const d = Math.hypot(cl - l, ct - t);
        if (d < bd && !S.blocks.some((o, j) => j !== self && j !== k && Math.abs(o.l - cl) < 1 && Math.abs(o.t - ct) < 1)) { bd = d; best = [cl, ct]; }
      }
    });
    if (best) [l, t] = best;
    return {l, t, r: l + W, b: t + BLOCK_H * IW};
  }

  // ---- block auto-detection (template = top face of the block sprite, normalized cross-correlation) ----
  let tplCache = null;
  function grayAt(src, sx, sy, sw, sh, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) out[i] = d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114;
    return out;
  }
  function detectBlocks() {
    if (!img || !blockImg.naturalWidth) return [];
    const k = 4 * IW / 1170;                 // work at 1/4 scale of a 1170-wide screen
    const tw = Math.round(112 / 4), th = Math.round(100 / 4);
    if (!tplCache) {
      const t = grayAt(blockImg, 12, 6, 112, 100, tw, th);
      let m = 0; t.forEach(v => m += v); m /= t.length;
      let ss = 0; for (let i = 0; i < t.length; i++) { t[i] -= m; ss += t[i] * t[i]; }
      tplCache = {t, n: Math.sqrt(ss)};
    }
    const {t, n: tn} = tplCache;
    const f = S.field, x0 = Math.max(0, f.l - 20), y0 = Math.max(0, f.t - 60);
    const W = Math.round((f.r - x0 + 20) / k), H = Math.round((f.b - y0 + 20) / k);
    const g = grayAt(img, x0, y0, W * k, H * k, W, H);
    const RW = W - tw, RH = H - th, res = new Float32Array(Math.max(0, RW * RH));
    // integral images for fast local mean/variance
    const I = new Float64Array((W + 1) * (H + 1)), I2 = new Float64Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = g[y * W + x], i = (y + 1) * (W + 1) + x + 1;
      I[i] = v + I[i - 1] + I[i - W - 1] - I[i - W - 2]; I2[i] = v * v + I2[i - 1] + I2[i - W - 1] - I2[i - W - 2];
    }
    const N = tw * th;
    for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
      const a = y * (W + 1) + x, b = a + tw, c = a + th * (W + 1), d = c + tw;
      const sum = I[d] - I[b] - I[c] + I[a], sum2 = I2[d] - I2[b] - I2[c] + I2[a];
      const vs = sum2 - sum * sum / N; if (vs < 1e-3) continue;
      let acc = 0;
      for (let j = 0; j < th; j++) { const row = (y + j) * W + x, tr = j * tw; for (let i = 0; i < tw; i++) acc += g[row + i] * t[tr + i]; }
      res[y * RW + x] = acc / (Math.sqrt(vs) * tn);
    }
    const score = (ix, iy) => {        // best score near an image-px position of the sprite-face top-left
      const cx = Math.round((ix - x0) / k), cy = Math.round((iy - y0) / k); let m = -1;
      for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++)
        if (x >= 0 && y >= 0 && x < RW && y < RH) m = Math.max(m, res[y * RW + x]);
      return m;
    };
    // peaks
    const peaks = [], r2 = res.slice();
    for (;;) {
      let bi = -1, bv = .6;
      for (let i = 0; i < r2.length; i++) if (r2[i] > bv) { bv = r2[i]; bi = i; }
      if (bi < 0) break;
      const px = bi % RW, py = (bi / RW) | 0;
      peaks.push({x: x0 + px * k, y: y0 + py * k, s: bv});
      for (let y = py - 18; y <= py + 18; y++) for (let x = px - 18; x <= px + 18; x++) if (x >= 0 && y >= 0 && x < RW && y < RH) r2[y * RW + x] = -1;
    }
    // colour check: block face is dull grey (low saturation, mid brightness) and its base is very dark
    const u = IW / 1170;
    const cc = document.createElement('canvas').getContext('2d', {willReadFrequently: true});
    const stats = (x, y, w, h) => {
      cc.canvas.width = Math.max(1, Math.round(w / 2)); cc.canvas.height = Math.max(1, Math.round(h / 2));
      cc.drawImage(img, x, y, w, h, 0, 0, cc.canvas.width, cc.canvas.height);
      const d = cc.getImageData(0, 0, cc.canvas.width, cc.canvas.height).data; let S = 0, V = 0, n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) { const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]); V += mx; S += mx ? (mx - mn) / mx * 255 : 0; }
      return {S: S / n, V: V / n};
    };
    const looksLikeBlock = q => {
      const face = stats(q.x, q.y, 112 * u, 100 * u), base = stats(q.x, q.y + 120 * u, 112 * u, 18 * u);
      return face.S < 110 && face.V < 145 && base.V < 80;
    };
    const P = BLOCK * IW, near = (a, b) => Math.abs(a - b) < 10 * IW / 1170;
    const aligned = (a, b) => (near(a.x, b.x) && Math.abs(Math.round((a.y - b.y) / P) * P - (a.y - b.y)) < 12) ||
                              (near(a.y, b.y) && Math.abs(Math.round((a.x - b.x) / P) * P - (a.x - b.x)) < 12);
    let found = peaks.filter(looksLikeBlock);
    // fill gaps inside straight runs (blocks partly hidden by enemies)
    for (const a of found.slice()) for (const b of found.slice()) {
      for (const [ax, dir] of [['x', 'y'], ['y', 'x']]) {
        if (!near(a[ax], b[ax]) || b[dir] <= a[dir]) continue;
        const steps = Math.round((b[dir] - a[dir]) / P);
        if (steps < 2 || steps > 6 || Math.abs(steps * P - (b[dir] - a[dir])) > 12) continue;
        for (let m = 1; m < steps; m++) {
          const q = {[ax]: a[ax], [dir]: a[dir] + m * (b[dir] - a[dir]) / steps};
          if (found.some(o => near(o.x, q.x) && near(o.y, q.y))) continue;
          if (score(q.x, q.y) >= .35) found.push({...q, s: 0});
        }
      }
    }
    // sprite-face top-left -> cell (face starts 5px into the sprite, sprite 5px into the cell, hitbox top 8px above sprite)
    return found.filter(q => q.y > f.t - 124 && q.y < f.b - 34)
                .map(q => { const l = q.x - 17 * IW / 1170, tt = q.y - 14 * IW / 1170; return {l, t: tt, r: l + P, b: tt + BLOCK_H * IW}; });
  }
  // ---- enemy auto-detection: every non-boss enemy has a small yellow HP bar under it ----
  // Measured: hit-circle centre ≈ bar centre x, 93px above the bar; minion hit radius ≈ 73px (of 1170).
  function detectEnemies() {
    if (!img) return [];
    const u = IW / 1170, f = S.field;
    const x0 = Math.max(0, Math.round(f.l - 30 * u)), y0 = Math.max(0, Math.round(f.t - 40 * u));
    const w = Math.round(Math.min(IW, f.r + 30 * u) - x0), h = Math.round(Math.min(IH, f.b + 60 * u) - y0);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(img, x0, y0, w, h, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, m = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2];
      if (r > 140 && gg > 110 && b < 60 && r - b > 110 && Math.abs(r - gg) < 60) m[i] = 1;
    }
    // connected components (4-neighbour flood fill)
    const seen = new Uint8Array(w * h), out = [], stack = [];
    for (let i = 0; i < w * h; i++) {
      if (!m[i] || seen[i]) continue;
      let minx = 1e9, maxx = -1, miny = 1e9, maxy = -1, n = 0; stack.push(i); seen[i] = 1;
      while (stack.length) {
        const j = stack.pop(), x = j % w, y = (j / w) | 0; n++;
        if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
        for (const k of [j - 1, j + 1, j - w, j + w]) if (k >= 0 && k < w * h && m[k] && !seen[k] && Math.abs((k % w) - x) <= 1) { seen[k] = 1; stack.push(k); }
      }
      const bw = maxx - minx + 1, bh = maxy - miny + 1;
      if (bw >= 45 * u && bw <= 140 * u && bh >= 4 * u && bh <= 22 * u && bw / bh > 3.5 && n > .6 * bw * bh)
        out.push({x: x0 + (minx + maxx) / 2, y: y0 + miny - 93 * u, R: 73 * u});
    }
    return out.filter(e => e.y > f.t - 60 * u && e.y < f.b);
  }
  function runDetect(quiet) {
    const B = detectBlocks(), E = detectEnemies();
    S.blocks = B;
    // keep enemies the user already placed; add detected ones that aren't near an existing circle
    E.forEach(e => { if (!S.enemies.some(o => Math.hypot(o.x - e.x, o.y - e.y) < o.R)) S.enemies.push(e); });
    persist(); draw();
    if (!quiet || B.length || E.length) toast(`敵${E.length}体・ブロック${B.length}個を自動で置きました`, 3000);
  }   // radius of the orange turn ring (measured ~97-112)
  const wallPad = () => WALL_PAD * IW;
  const S = {
    field: {l: DEFAULT_FIELD.l * IW, t: DEFAULT_FIELD.t * IH, r: DEFAULT_FIELD.r * IW, b: DEFAULT_FIELD.b * IH},
    ball: {x: IW * .5, y: IH * .64},
    r: 55,   // ball radius (blocks/enemies). Walls: center stops at x=55..1115 of 1170 = screen edge minus this radius
    enemies: [],
    blocks: [],
    wobble: 0.5,
    pierce: false,
    angle: -60,                      // degrees, 0 = right, negative = up
    bounces: 5,
    pointAim: false,   // false = Monst-style pull (default), true = touch the target direction
    showWidth: true,
    dim: false,
    pins: []
  };
  let mode = 'ball';

  // restore light prefs
  const toRatio = () => ({
    field: {l: S.field.l / IW, t: S.field.t / IH, r: S.field.r / IW, b: S.field.b / IH},
    ball: {x: S.ball.x / IW, y: S.ball.y / IH},
    r: S.r / IW, angle: S.angle, bounces: S.bounces, pointAim: S.pointAim, showWidth: S.showWidth, pierce: S.pierce, dim: S.dim,

    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * size, cy - Math.sin(a) * size); ctx.lineTo(cx + Math.cos(a) * size, cy + Math.sin(a) * size); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

  function drawLoupe(sx, sy) {
    const size = 150, zoom = 1.7;
    const src = size / zoom;
    loupe.width = size * dpr; loupe.height = size * dpr;
    const lc = loupe.getContext('2d');
    lc.imageSmoothingEnabled = false;
    lc.drawImage(cv, (sx - src / 2) * dpr, (sy - src / 2) * dpr, src * dpr, src * dpr, 0, 0, size * dpr, size * dpr);
    const w = cv.clientWidth;
    const lx = sx < w / 2 ? w - size - 10 : 10, ly = 10;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(loupe, lx, ly, size, size);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx + size / 2 - 8, ly + size / 2); ctx.lineTo(lx + size / 2 + 8, ly + size / 2);
    ctx.moveTo(lx + size / 2, ly + size / 2 - 8); ctx.lineTo(lx + size / 2, ly + size / 2 + 8); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx + size / 2, ly + size / 2, size / 2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

  function drawWobble(pts) {
    const sp = pts.map(p => toS(p[0], p[1]));
    ctx.save(); ctx.lineJoin = ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3.5; polyline(sp); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 4]); polyline(sp); ctx.stroke();
    ctx.restore();
  }

  function drawBlocks() {
    ctx.save();
    // draw top rows first so lower blocks overlap the base of the ones above (like the game)
    S.blocks.map((B, k) => [B, k]).sort((a, b) => a[0].t - b[0].t).forEach(([B, k]) => {
      const [x1, y1] = toS(B.l, B.t), [x2, y2] = toS(B.r, B.b), w = x2 - x1, h = y2 - y1;
      const sel = mode === 'place' && k === selBlock;
      if (blockImg.complete && blockImg.naturalWidth) {
        // sprite: 136x156 drawn inside the 146 cell (5px margin, base shadow hangs below)
        const sc = w / 146.25;
        ctx.globalAlpha = .9;
        ctx.drawImage(blockImg, x1 + 5 * sc, y1 + 8 * sc, 136 * sc, 156 * sc);
        ctx.globalAlpha = 1;
      } else { ctx.fillStyle = 'rgba(120,200,255,.2)'; ctx.fillRect(x1, y1, w, h); }
      ctx.setLineDash(sel ? [6, 4] : [3, 4]); ctx.lineWidth = sel ? 2.5 : 1.2;
      ctx.strokeStyle = sel ? '#78c8ff' : 'rgba(120,200,255,.8)'; ctx.strokeRect(x1, y1, w, h); ctx.setLineDash([]);
    });
    ctx.restore();
  }

  function drawEnemies(hits) {
    ctx.save();
    S.enemies.forEach((e, k) => {
      const [x, y] = toS(e.x, e.y), R = e.R * scale, hit = hits.has(k), sel = mode === 'place' && k === selEnemy;
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
      ctx.fillStyle = hit ? 'rgba(255,70,120,.32)' : 'rgba(255,70,120,.10)'; ctx.fill();
      ctx.setLineDash(sel ? [6, 4] : []);
      ctx.lineWidth = hit || sel ? 3 : 2; ctx.strokeStyle = hit ? '#ff4d88' : 'rgba(255,120,160,.85)'; ctx.stroke();
      ctx.setLineDash([]);
      if (mode === 'place') {
        ctx.fillStyle = '#ff4d88';
        ctx.beginPath(); ctx.arc(x + R, y, 7, 0, Math.PI * 2); ctx.fill();   // resize handle
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();
  }

  function moveTip(sx, sy) {
    const [ix, iy] = toI(sx, sy), a = S.angle * Math.PI / 180;
    tipD = (ix - S.ball.x) * Math.cos(a) + (iy - S.ball.y) * Math.sin(a);   // project onto the shot line
    tipD = Math.max(S.r * 1.2, Math.min(tipD, maxTip()));
  }

  // ball center may go a little past the frame line
  function clampBall() {
    const f = S.field, k = wallPad();
    S.ball.x = Math.min(Math.max(S.ball.x, f.l + k), f.r - k);
    S.ball.y = Math.min(Math.max(S.ball.y, f.t + k), f.b - k);
  }

  // ---- input ----
  function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  function setAimFrom(sx, sy) {
    const [ix, iy] = toI(sx, sy);
    const bx = S.ball.x, by = S.ball.y;
    let dx = ix - bx, dy = iy - by;
    if (Math.hypot(dx, dy) < 2) return;
    S.angle = Math.atan2(dy, dx) * 180 / Math.PI;
  }

  let selEnemy = -1, selBlock = -1, lastEnemyR = 95 / 1170 * IW, editShape = 'circle';
  const $ = id => document.getElementById(id);

  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    closeMenu();
    const [sx, sy] = pos(e);
    const [ix, iy] = toI(sx, sy);
    hint.style.display = 'none';
    if (mode === 'arrow') { dragInfo = {kind: 'tip', sx, sy}; moveTip(sx, sy); draw(); return; }
    if (mode === 'ball') {   // tap = snap to the turn ring there; drag = move relatively (finger never hides the ball)
      dragInfo = {kind: 'ballRel', sx, sy, lx: sx, ly: sy, sx0: sx, sy0: sy, t0: performance.now()}; draw(); return;
    }
    if (mode === 'place') {
      // "+" next to the selected block
      if (selBlock >= 0 && S.blocks[selBlock]) {
        const B = S.blocks[selBlock];
        for (const [x, y, dx, dy] of plusSpots(B)) {
          const [hx, hy] = toS(x, y);
          if (Math.hypot(sx - hx, sy - hy) < 20) {
            S.blocks.push({l: B.l + dx, t: B.t + dy, r: B.r + dx, b: B.b + dy}); selBlock = S.blocks.length - 1; selEnemy = -1;
            persist(); syncUI(); draw(); return;
          }
        }
      }
      // existing block?
      for (let i = S.blocks.length - 1; i >= 0; i--) {
        const B = S.blocks[i];
        if (ix > B.l && ix < B.r && iy > B.t && iy < B.b && editShape === 'rect') {
          selBlock = i; selEnemy = -1;
          dragInfo = {kind: 'block', k: i, off: [B.l - ix, B.t - iy], sx, sy}; syncUI(); draw(); return;
        }
      }
      // existing enemy?
      for (let i = S.enemies.length - 1; i >= 0; i--) {
        const en = S.enemies[i], [ex, ey] = toS(en.x, en.y), R = en.R * scale, d = Math.hypot(sx - ex, sy - ey);
        if (Math.hypot(sx - (ex + R), sy - ey) < 22 || Math.abs(d - R) < 12) {
          selEnemy = i; selBlock = -1; dragInfo = {kind: 'enemy', how: 'resize', k: i, sx, sy, sx0: sx, sy0: sy}; syncUI(); draw(); return;
        }
        if (d < R) { selEnemy = i; selBlock = -1; dragInfo = {kind: 'enemy', how: 'move', k: i, off: [en.x - ix, en.y - iy], sx, sy}; syncUI(); draw(); return; }
      }
      // block under finger while the enemy tool is active: just select it (enemies are often drawn over blocks)
      for (let i = S.blocks.length - 1; i >= 0; i--) {
        const B = S.blocks[i];
        if (ix > B.l && ix < B.r && iy > B.t && iy < B.b) {
          selBlock = i; selEnemy = -1; dragInfo = {kind: 'block', k: i, off: [B.l - ix, B.t - iy], sx, sy}; syncUI(); draw(); return;
        }
      }
      // empty: place a new one
      if (editShape === 'rect') {
        const W = BLOCK * IW;
        S.blocks.push(placeBlock(ix - W / 2, iy - W / 2)); selBlock = S.blocks.length - 1; selEnemy = -1;
        dragInfo = {kind: 'block', k: selBlock, off: [-W / 2, -W / 2], sx, sy};
      } else {
        S.enemies.push({x: ix, y: iy, R: lastEnemyR}); selEnemy = S.enemies.length - 1; selBlock = -1;
        dragInfo = {kind: 'enemy', how: 'new', k: selEnemy, off: [0, 0], sx, sy, sx0: sx, sy0: sy};
      }
      syncUI(); draw(); return;
    }
    if (mode === 'field') {
      const f = S.field; const [fl, ft] = toS(f.l, f.t), [fr, fb] = toS(f.r, f.b);
      const tol = 26;
      const edges = {
        l: Math.abs(sx - fl) < tol && sy > ft - tol && sy < fb + tol,
        r: Math.abs(sx - fr) < tol && sy > ft - tol && sy < fb + tol,
        t: Math.abs(sy - ft) < tol && sx > fl - tol && sx < fr + tol,
        b: Math.abs(sy - fb) < tol && sx > fl - tol && sx < fr + tol,
      };
      const sel = Object.keys(edges).filter(k => edges[k]);
      if (sel.length) dragInfo = {kind: 'field', edges: sel, sx, sy};
      else if (sx > fl && sx < fr && sy > ft && sy < fb) dragInfo = {kind: 'fieldMove', start: [ix, iy], orig: {...f}, sx, sy};
      draw(); return;
    }
    // aim
    if (S.pointAim) { dragInfo = {kind: 'aim', sx, sy}; setAimFrom(sx, sy); }
    else dragInfo = {kind: 'pull', sx, sy, sx0: sx, sy0: sy};
    draw();
  });

  cv.addEventListener('pointermove', e => {
    if (!dragInfo) return;
    const [sx, sy] = pos(e);
    dragInfo.sx = sx; dragInfo.sy = sy;
    const [ix, iy] = toI(sx, sy);
    const k = dragInfo.kind;
    if (k === 'tip') moveTip(sx, sy);
    else if (k === 'ballRel') {
      S.ball.x += (sx - dragInfo.lx) / scale; S.ball.y += (sy - dragInfo.ly) / scale; clampBall();
      dragInfo.lx = sx; dragInfo.ly = sy; padFocus = [S.ball.x, S.ball.y];
    }
    else if (k === 'block') S.blocks[dragInfo.k] = placeBlock(ix + dragInfo.off[0], iy + dragInfo.off[1], dragInfo.k);
    else if (k === 'enemy') {
      const en = S.enemies[dragInfo.k];
      if (dragInfo.how === 'move') { en.x = ix + dragInfo.off[0]; en.y = iy + dragInfo.off[1]; }
      else if (dragInfo.how === 'resize' || Math.hypot(sx - dragInfo.sx0, sy - dragInfo.sy0) > 12) {
        en.R = Math.max(15, Math.hypot(ix - en.x, iy - en.y)); lastEnemyR = en.R;
      }
    }
    else if (k === 'aim') setAimFrom(sx, sy);
    else if (k === 'pull') {
      const vx = dragInfo.sx0 - sx, vy = dragInfo.sy0 - sy;
      if (Math.hypot(vx, vy) > 10) S.angle = Math.atan2(vy, vx) * 180 / Math.PI;
    }
    else if (k === 'field') {
      const f = S.field, min = 40;
      for (const ed of dragInfo.edges) {
        if (ed === 'l') f.l = Math.min(ix, f.r - min);
        if (ed === 'r') f.r = Math.max(ix, f.l + min);
        if (ed === 't') f.t = Math.min(iy, f.b - min);
        if (ed === 'b') f.b = Math.max(iy, f.t + min);
      }
    }
    else if (k === 'fieldMove') {
      const dx = ix - dragInfo.start[0], dy = iy - dragInfo.start[1], o = dragInfo.orig;
      Object.assign(S.field, {l: o.l + dx, r: o.r + dx, t: o.t + dy, b: o.b + dy});
    }
    draw();
  });
  const end = () => {
    if (!dragInfo) return;
    const di = dragInfo;
    if (di.kind === 'ballRel' && Math.hypot(di.sx - di.sx0, di.sy - di.sy0) < 8) {
      const [ix, iy] = toI(di.sx0, di.sy0), r = findRing(ix, iy);
      if (r) { S.ball.x = r.x; S.ball.y = r.y; toast('キャラの輪に合わせました', 1500); }
      else { S.ball.x = ix; S.ball.y = iy; toast('輪が見つからないのでタップした位置に置きました', 2200); }
    }
    dragInfo = null; padFocus = null; clampBall(); persist(); draw(); };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  // ---- trackpad: relative, constant ratio (no acceleration) ----
  const PAD_GAIN = 1 / 3;
  const pad = $('pad');
  let padLast = null, blockAcc = null;
  pad.addEventListener('pointerdown', e => {
    pad.setPointerCapture(e.pointerId); closeMenu(); padLast = [e.clientX, e.clientY]; pad.classList.add('active');
    if (mode === 'place' && selBlock >= 0) { const B = S.blocks[selBlock]; blockAcc = [B.l, B.t]; }
    hint.style.display = 'none';
  });
  pad.addEventListener('pointermove', e => {
    if (!padLast) return;
    const dx = e.clientX - padLast[0], dy = e.clientY - padLast[1]; padLast = [e.clientX, e.clientY];
    const gx = dx / scale * PAD_GAIN, gy = dy / scale * PAD_GAIN;
    if (mode === 'ball') { S.ball.x += gx; S.ball.y += gy; clampBall(); padFocus = [S.ball.x, S.ball.y]; }
    else if (mode === 'place') {
      if (selEnemy >= 0) { const en = S.enemies[selEnemy]; en.x += gx; en.y += gy; padFocus = [en.x, en.y]; }
      else if (selBlock >= 0 && blockAcc) {
        blockAcc[0] += gx; blockAcc[1] += gy;
        S.blocks[selBlock] = placeBlock(blockAcc[0], blockAcc[1], selBlock);
        padFocus = [S.blocks[selBlock].l, S.blocks[selBlock].t];
      }
    }
    else if (mode === 'aim') { S.angle += dx * 0.015; }          // ~0.5° per cm
    else if (mode === 'arrow') {
      const a = S.angle * Math.PI / 180;
      tipD = Math.max(S.r * 1.2, Math.min((tipD || 0) + (dx * Math.cos(a) + dy * Math.sin(a)) / scale * .5, maxTip()));
    }
    draw();
  });
  const padEnd = () => { padLast = null; padFocus = null; blockAcc = null; pad.classList.remove('active'); persist(); draw(); };
  pad.addEventListener('pointerup', padEnd);
  pad.addEventListener('pointercancel', padEnd);

  // ---- menu ----
  const menu = $('menu');
  const closeMenu = () => menu.classList.remove('open');
  $('more').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('pointerdown', e => {
    if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== $('more')) closeMenu();
  });

  // ---- steps ----
  const HINTS = {
    ball: '① 玉：自分のキャラをタップ（輪に自動で合わせる）／ずれたらドラッグ・パッドで微調整',
    place: '② 配置：タップで置く／ドラッグで移動／ブロックを選ぶと＋で追加',
    aim: '③ 狙う：引っ張って角度を決める／パッドを左右で微調整',
    arrow: '矢印：角度は固定。なぞって矢印の先に合う目印を探す',
    field: '赤枠の辺・角をドラッグで調整',
  };
  function setMode(m) {
    mode = m;
    if (m !== 'place') { selEnemy = -1; selBlock = -1; }
    const step = m === 'arrow' ? 'aim' : m;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.step === step));
    $('row-ball').classList.toggle('show', step === 'ball');
    $('row-place').classList.toggle('show', step === 'place');
    $('row-aim').classList.toggle('show', step === 'aim');
    $('row-aim2').classList.toggle('show', step === 'aim');
    $('fieldBar').classList.toggle('show', m === 'field');
    $('mArrow').classList.toggle('on', m === 'arrow');
    pad.textContent = {ball: 'パッド：玉を少しずつ動かす', place: 'パッド：選んだ敵・ブロックを少しずつ動かす',
                       aim: 'パッド：左右で角度を微調整', arrow: 'パッド：矢印の先を動かす', field: ''}[m];
    hint.style.display = ''; hint.textContent = HINTS[m] || '';
    syncUI(); layout();
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setMode(b.dataset.step));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => setMode(b.dataset.go));
  $('mField').onclick = () => { closeMenu(); setMode('field'); };
  $('fieldDone').onclick = () => setMode('ball');
  $('mArrow').onclick = () => setMode(mode === 'arrow' ? 'aim' : 'arrow');
  $('eDel').onclick = () => {
    if (selEnemy >= 0) S.enemies.splice(selEnemy, 1);
    else if (selBlock >= 0) S.blocks.splice(selBlock, 1);
    selEnemy = selBlock = -1; persist(); syncUI(); draw();
  };
  $('eClear').onclick = () => { S.enemies = []; S.blocks = []; selEnemy = selBlock = -1; closeMenu(); persist(); syncUI(); draw(); };
  const resizeSel = f => { if (selEnemy >= 0) { const en = S.enemies[selEnemy]; en.R = Math.max(15, en.R + f * IW / 1170); lastEnemyR = en.R; persist(); draw(); } };
  $('szMinus').onclick = () => resizeSel(-3);
  $('szPlus').onclick = () => resizeSel(3);
  const setShape = sh => { editShape = sh; $('shCircle').classList.toggle('on', sh === 'circle'); $('shRect').classList.toggle('on', sh === 'rect'); };
  $('shCircle').onclick = () => setShape('circle');
  $('shRect').onclick = () => setShape('rect');
  $('wobble').onclick = () => { S.wobble = S.wobble === 0 ? 0.5 : S.wobble === 0.5 ? 1 : 0; syncUI(); persist(); draw(); };
  $('pierce').onclick = () => { S.pierce = !S.pierce; syncUI(); persist(); draw(); };
  $('dim').onclick = () => { S.dim = !S.dim; syncUI(); persist(); draw(); };
  $('resetField').onclick = () => {
    S.field = {l: DEFAULT_FIELD.l * IW, t: DEFAULT_FIELD.t * IH, r: DEFAULT_FIELD.r * IW, b: DEFAULT_FIELD.b * IH};
    persist(); layout();
  };
  document.querySelectorAll('[data-da]').forEach(b => {
    b.onclick = () => { S.angle += parseFloat(b.dataset.da); persist(); draw(); };
  });
  const syncUI = () => {
    $('bv').textContent = S.bounces;
    $('radius').value = Math.round(S.r); $('rv').textContent = Math.round(S.r);
    $('pull').classList.toggle('on', S.pointAim);
    $('pierce').classList.toggle('on', S.pierce);
    $('wobble').textContent = S.wobble ? `ブレ幅 ±${S.wobble}°` : 'ブレ幅 なし';
    $('wobble').classList.toggle('on', S.wobble > 0);
    $('width').classList.toggle('on', S.showWidth);
    $('dim').textContent = S.dim ? '画面：暗め' : '画面：通常';
    $('dim').classList.toggle('on', S.dim);
    $('szMinus').disabled = $('szPlus').disabled = selEnemy < 0;
    $('szMinus').style.opacity = $('szPlus').style.opacity = selEnemy < 0 ? .4 : 1;
    $('eDel').style.opacity = (selEnemy < 0 && selBlock < 0) ? .4 : 1;
    const lab = $('stageLabel'); lab.style.display = cur ? '' : 'none';
    if (cur) lab.textContent = `${cur.q} / ステージ${cur.s + 1}`;
  };
  const setBounces = n => { S.bounces = Math.max(1, Math.min(20, n)); syncUI(); persist(); draw(); };
  $('bMinus').onclick = () => setBounces(S.bounces - 1);
  $('bPlus').onclick = () => setBounces(S.bounces + 1);
  $('radius').oninput = e => { S.r = +e.target.value; $('rv').textContent = S.r; clampBall(); persist(); layout(); };
  $('pull').onclick = () => { S.pointAim = !S.pointAim; syncUI(); persist(); };
  $('width').onclick = () => { S.showWidth = !S.showWidth; syncUI(); persist(); draw(); };
  $('pin').onclick = () => { S.pins.push({x: S.ball.x, y: S.ball.y, angle: S.angle, r: S.r, bounces: S.bounces}); draw(); };
  $('clearPins').onclick = () => { S.pins = []; closeMenu(); draw(); };
  $('detect').onclick = () => { closeMenu(); runDetect(false); };

  // toast
  let toastTimer;
  function toast(html, ms = 4000) {
    const t = $('toast'); t.innerHTML = html; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---- modal sheet helpers ----
  const modal = $('modal'), sheet = $('sheet');
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  function openSheet(html, bind) { sheet.innerHTML = html; modal.classList.add('show'); bind && bind(sheet); }
  const closeSheet = () => modal.classList.remove('show');
  modal.addEventListener('pointerdown', e => { if (e.target === modal) closeSheet(); });

  // ---- image import ----
  $('btnImg').onclick = () => { closeMenu(); $('file').click(); };
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const R = toRatio();               // frame & placements are kept as ratios of the screen size
      img = im; IW = im.naturalWidth; IH = im.naturalHeight;
      fromRatio(R);
      $('radius').max = Math.round(IW / 6);
      S.pins = []; tipD = null;
      const after = reset => {
        closeSheet();
        if (reset) { S.enemies = []; S.blocks = []; cur = null; setTimeout(() => runDetect(true), 30); }
        selEnemy = selBlock = -1; persist(); setMode('ball');
      };
      if (S.enemies.length || S.blocks.length) {
        openSheet(`<h3>前の配置はどうしますか？</h3>
          <div class="small">敵 ${S.enemies.length}体・ブロック ${S.blocks.length}個が置かれています</div>
          <button id="keepP" class="on" style="padding:13px">そのまま使う（玉の位置だけ決める）</button>
          <button id="resetP" style="padding:13px">リセットして作り直す（敵・ブロックを自動検出）</button>`,
          sh => { sh.querySelector('#keepP').onclick = () => after(false); sh.querySelector('#resetP').onclick = () => after(true); });
        setMode('ball');
      } else after(true);
    };
    im.src = url;
  }
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

  // ---- stage library (quest -> stages). Saves frame, blocks, enemies (not the ball) ----
  const LIB_KEY = 'monst-stages-v1';
  let cur = null;   // {q: quest name, s: stage index} of the loaded stage
  const loadLib = () => { try { return JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch (e) { return []; } };
  const saveLib = L => { try { localStorage.setItem(LIB_KEY, JSON.stringify(L)); return true; } catch (e) { toast('保存できませんでした'); return false; } };
  const snapshot = () => { const R = toRatio(); return {field: R.field, blocks: R.blocks, enemies: R.enemies, savedAt: Date.now()}; };
  function applyStage(st) {
    fromRatio({field: st.field, blocks: st.blocks || [], enemies: st.enemies || []});
    selEnemy = selBlock = -1; S.pins = []; persist();
  }
  function stageSheet() {
    const L = loadLib();
    let html = `<h3>📁 ステージ保存・読み込み</h3>
      <div class="small">枠・ブロック・敵の配置を保存します（玉の位置は保存しません）</div>`;
    L.forEach((q, qi) => {
      html += `<div class="q"><div class="qh"><b>${esc(q.name)}</b><button data-delq="${qi}" class="danger">削除</button></div>`;
      q.stages.forEach((st, si) => {
        const isCur = cur && cur.q === q.name && cur.s === si;
        html += `<div class="st"><span>ステージ${si + 1}${isCur ? '（表示中）' : ''}　敵${(st.enemies || []).length}・ブロック${(st.blocks || []).length}</span>
          <button data-load="${qi},${si}">読込</button><button data-over="${qi},${si}">上書き</button><button data-dels="${qi},${si}" class="danger">✕</button></div>`;
      });
      html += `<button data-add="${qi}">＋ 今の配置をステージ${q.stages.length + 1}として保存</button></div>`;
    });
    html += `<div class="q"><div class="small">新しいクエスト</div><input type="text" id="qname" placeholder="クエスト名（例：〇〇 超究極）">
      <button id="qcreate">作成して今の配置をステージ1に保存</button></div>
      <div class="row"><button id="bkOut">バックアップを書き出す</button><button id="bkIn">バックアップを読み込む</button></div>
      <button id="closeS">閉じる</button>`;
    openSheet(html, sh => {
      const armed = {};   // tap twice to delete
      const confirm2 = (btn, key, fn) => { if (armed[key]) fn(); else { armed[key] = 1; btn.textContent = 'もう一度押すと削除'; } };
      sh.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
        const [qi, si] = b.dataset.load.split(',').map(Number); applyStage(L[qi].stages[si]);
        cur = {q: L[qi].name, s: si}; closeSheet(); setMode('ball'); toast(`${esc(L[qi].name)} ステージ${si + 1}を読み込みました`, 2500);
      });
      sh.querySelectorAll('[data-over]').forEach(b => b.onclick = () => {
        const [qi, si] = b.dataset.over.split(',').map(Number); L[qi].stages[si] = snapshot();
        if (saveLib(L)) { cur = {q: L[qi].name, s: si}; toast('上書き保存しました', 2000); stageSheet(); syncUI(); }
      });
      sh.querySelectorAll('[data-dels]').forEach(b => b.onclick = () => confirm2(b, 's' + b.dataset.dels, () => {
        const [qi, si] = b.dataset.dels.split(',').map(Number); L[qi].stages.splice(si, 1);
        if (cur && cur.q === L[qi].name) cur = null; saveLib(L); stageSheet(); syncUI();
      }));
      sh.querySelectorAll('[data-delq]').forEach(b => b.onclick = () => confirm2(b, 'q' + b.dataset.delq, () => {
        const qi = +b.dataset.delq; if (cur && cur.q === L[qi].name) cur = null; L.splice(qi, 1); saveLib(L); stageSheet(); syncUI();
      }));
      sh.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
        const qi = +b.dataset.add; L[qi].stages.push(snapshot());
        if (saveLib(L)) { cur = {q: L[qi].name, s: L[qi].stages.length - 1}; toast('保存しました', 2000); stageSheet(); syncUI(); }
      });
      sh.querySelector('#qcreate').onclick = () => {
        const name = sh.querySelector('#qname').value.trim();
        if (!name) { sh.querySelector('#qname').focus(); return; }
        let q = L.find(x => x.name === name); if (!q) { q = {name, stages: []}; L.push(q); }
        q.stages.push(snapshot());
        if (saveLib(L)) { cur = {q: name, s: q.stages.length - 1}; toast('保存しました', 2000); stageSheet(); syncUI(); }
      };
      sh.querySelector('#bkOut').onclick = () => {
        const txt = JSON.stringify({app: 'monst-hojosen', v: 1, quests: loadLib()});
        openSheet(`<h3>バックアップを書き出す</h3><div class="small">この文字をメモ帳などに保存しておくと、あとで読み込めます</div>
          <textarea id="bkTxt" readonly>${esc(txt)}</textarea><button id="bkCopy" class="on">コピー</button><button id="bkBack">戻る</button>`, s2 => {
          s2.querySelector('#bkCopy').onclick = async () => {
            try { await navigator.clipboard.writeText(txt); toast('コピーしました', 2000); }
            catch (e) { const t = s2.querySelector('#bkTxt'); t.select(); toast('文字を長押ししてコピーしてください', 3000); }
          };
          s2.querySelector('#bkBack').onclick = stageSheet;
        });
      };
      sh.querySelector('#bkIn').onclick = () => {
        openSheet(`<h3>バックアップを読み込む</h3><div class="small">書き出した文字を貼り付けてください。同じ名前のクエストは置き換わります</div>
          <textarea id="bkTxt" placeholder="ここに貼り付け"></textarea><button id="bkDo" class="on">読み込む</button><button id="bkBack">戻る</button>`, s2 => {
          s2.querySelector('#bkDo').onclick = () => {
            try {
              const d = JSON.parse(s2.querySelector('#bkTxt').value);
              const qs = Array.isArray(d) ? d : d.quests; if (!Array.isArray(qs)) throw 0;
              const L2 = loadLib();
              qs.forEach(q => { if (!q || !q.name || !Array.isArray(q.stages)) return; const i = L2.findIndex(x => x.name === q.name); if (i >= 0) L2[i] = q; else L2.push(q); });
              if (saveLib(L2)) { toast(`${qs.length}件のクエストを読み込みました`, 2500); stageSheet(); }
            } catch (e) { toast('読み込めませんでした（文字が途中で切れていないか確認してください）', 3500); }
          };
          s2.querySelector('#bkBack').onclick = stageSheet;
        });
      };
      sh.querySelector('#closeS').onclick = closeSheet;
    });
  }
  $('stages').onclick = () => { closeMenu(); stageSheet(); };

  document.getElementById('ver').textContent = 'v' + VERSION;
  window.addEventListener('resize', layout);
  setMode('ball');
})();
</script>
</body>
</html>
