<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補助線">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>反射補助線ツール</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaef; --muted:#8b93a3;
    --accent:#ffcf3f; --accent2:#4fd1ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
  body{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  @media (min-aspect-ratio: 3/4){body{max-width:min(100vw,calc(100vh*.62));margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  #stage{flex:1;position:relative;min-height:0;margin-top:env(safe-area-inset-top)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.6);
    padding:6px 12px;border-radius:999px;font-size:12px;color:#fff;pointer-events:none;white-space:nowrap}
  #panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button,.btn{appearance:none;border:1px solid var(--line);background:#222733;color:var(--text);
    border-radius:8px;padding:8px 9px;font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer;line-height:1}
  button:active{transform:scale(.97)}
  button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent}
  .seg button.on{background:var(--accent);color:#1a1a1a}
  label.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap}
  label.sl input{flex:1;min-width:0;width:60px;accent-color:var(--accent)}
  label.sl b{color:var(--text);min-width:24px;text-align:right}
  #angle{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:64px;text-align:center;font-size:15px}
  .grow{flex:1}
  input[type=file]{display:none}
  .small{font-size:11px;color:var(--muted)}
  #panel{position:relative}
  #menu{display:none;position:absolute;right:10px;bottom:calc(100% + 6px);width:230px;background:#1f232c;
    border:1px solid var(--line);border-radius:12px;padding:8px;flex-direction:column;gap:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
  #menu.open{display:flex}
  #menu button{text-align:left;width:100%;padding:11px 10px}
  #menu label.sl{padding:4px 2px}
  #fieldBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #fieldBar.show{display:flex}
  #enemyBar{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);gap:8px}
  #enemyBar.show{display:flex}
  #enemyBar button{padding:8px 8px}
  #enemyBar .seg{background:#181b22}
  #toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,22,28,.95);
    border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;
    display:none;align-items:center;gap:10px;z-index:9;white-space:nowrap}
  #toast.show{display:flex}
  #courseCard{display:none;position:absolute;left:8px;right:8px;bottom:8px;background:rgba(15,17,21,.92);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;max-height:42%;overflow:auto;z-index:4}
  #courseCard.show{display:block}
  #courseCard b{color:var(--accent)}
  #courseCard .cc-h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  #courseCard .cc-h span{flex:1;font-weight:700}
  #courseCard button{padding:5px 8px;font-size:12px}
  #ceBar{display:none;flex-direction:column;gap:6px;border:1px solid var(--accent);border-radius:10px;padding:8px}
  body.cedit #ceBar{display:flex}
  body.cedit #mainRow, body.cedit #row-place .next{display:none !important}
  #cpEdit{padding:6px 9px;font-size:12px}
  .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .kgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
  .kgrid img{width:100%;border-radius:6px}
  #coursePanel{display:none;flex-direction:column;gap:8px}
  body.course #coursePanel{display:flex}
  body.course #mainRow, body.course .stepRow, body.course #pad{display:none !important}
  #cpCtl{display:none}
  #cpCtl.show{display:flex}
  .needBall{display:block;color:#111;background:var(--accent);border-radius:8px;padding:8px 10px;font-size:13px}
  #cpFree.on, #cpArrow.on{background:var(--accent);color:#111}
  .bsFire{background:#ff2f6d !important;color:#fff !important;font-weight:700}
  .wbtn.on{background:var(--accent);color:#111}
  #cpPhases{display:flex;gap:5px}
  #cpPhases:empty{display:none}
  #cpPhases button{flex:1;padding:6px 8px;font-size:12px}
  .cpr .ord{color:#ff8fb1;font-weight:700}
  .cpr .warn{color:#ffb020;font-weight:700}
  .cpr .okk{color:#5bd68a}
  .cpr.diff{border-color:#ffb020}
  #cpStages{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
  #cpStages button{flex:none;padding:8px 10px}
  #cpList{display:flex;flex-direction:column;gap:6px;height:26vh;overflow:auto}
  .cpr{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#1c2029}
  .cpr.on{border-color:var(--accent);background:#2a2614}
  .cpr .ang{font-weight:700;color:var(--accent);font-size:17px;min-width:66px}
  .cpr .d{flex:1;font-size:11px;line-height:1.45;color:var(--muted)}
  .cpr img{width:46px;border-radius:4px}
  .stg{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;align-items:flex-start}
  .stg img{width:132px;border-radius:6px;flex:none}
  .stg .tx{flex:1;font-size:12px;line-height:1.5}
  .stg .tx b{font-size:14px;color:var(--accent)}
  .res{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px}
  .res .ang{font-weight:700;color:var(--accent);min-width:60px;font-size:15px}
  .res .d{flex:1;font-size:12px;line-height:1.4}
  #tabs{display:flex;gap:4px;flex:1}
  #tabs button{flex:1;padding:9px 4px;background:#1c2029}
  #tabs button.on{background:var(--accent);color:#1a1a1a}
  .stepRow{display:none;gap:6px;align-items:center;flex-wrap:nowrap}
  .stepRow.show{display:flex}
  #stab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
  #stab button{padding:5px 8px;font-size:12px}
  .next{background:#2d3b55;border-color:#3d5378}
  #pad{height:86px;border:1px dashed #3a4252;border-radius:12px;background:repeating-linear-gradient(45deg,#1a1e26,#1a1e26 6px,#1c2129 6px,#1c2129 12px);
    touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;user-select:none;-webkit-user-select:none}
  #pad.active{border-color:var(--accent);color:var(--text)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;align-items:flex-end;justify-content:center}
  #modal.show{display:flex}
  #sheet{background:#1b1f27;border-top-left-radius:16px;border-top-right-radius:16px;width:100%;max-width:520px;max-height:85%;overflow:auto;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  #sheet h3{margin:2px 0 4px;font-size:16px}
  #sheet .q{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #sheet .qh{display:flex;align-items:center;gap:6px}
  #sheet .qh b{flex:1;font-size:14px}
  #sheet .st{display:flex;align-items:center;gap:6px;padding-left:6px}
  #sheet .st span{flex:1;color:var(--muted)}
  #sheet input[type=text],#sheet textarea{width:100%;background:#11141a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px}
  #sheet textarea{height:120px;font-size:11px}
  .danger{color:#ff8a8a}
  #stageLabel{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint"></div>
  <div id="stageLabel"></div>
  <div id="courseCard"></div>
  <div id="fieldBar"><button id="resetField">↺ 初期位置</button><button id="fieldDone" class="on">完了</button></div>
</div>
<div id="panel">
  <div id="ceBar">
    <div class="row" style="flex-wrap:nowrap;gap:6px"><b id="ceTitle" style="flex:1;font-size:13px"></b><button id="ceCancel">やめる</button><button id="ceDone" class="on">保存</button></div>
    <div class="row" style="flex-wrap:nowrap;gap:6px"><button id="ceName">名前を変える</button><button id="ceReset">初期配置に戻す</button></div>
    <div class="small">敵をタップで選択・ドラッグで移動、右の点で大きさ。敵や地雷の追加・削除は下のボタン。保存すると、このステージ・段階で使うたびにこの配置になります</div>
  </div>
  <div id="coursePanel">
    <div class="row" style="flex-wrap:nowrap;gap:6px">
      <button id="cpExit">✕</button><b id="cpTitle" style="font-size:14px"></b><button id="cpEdit">✎ 編集</button><span style="flex:1"></span>
      <button id="cpImg">🖼 画像</button><button id="cpWatch" class="wbtn" style="display:none">🖥 自動</button><button class="bsShot bsb" style="display:none">📸 BS</button><button id="cpZoom">🔍</button><button id="cpInfo">要点</button>
    </div>
    <div id="cpStages"></div>
    <div id="cpPhases"></div>
    <div id="cpHint" class="small">キャラの真ん中をタップして玉を置くと、取れるルートが下に出ます</div>
    <div id="cpCtl" class="row" style="flex-wrap:nowrap;gap:6px">
      <span class="small">反射</span><button id="cpBm">−</button><b id="cpBn" style="min-width:22px;text-align:center"></b><button id="cpBp">＋</button>
      <span style="flex:1"></span><button id="cpFree">✍ 自由に狙う</button><button id="cpArrow">➶ 矢印</button><button class="bsFire bsb" style="display:none">🎯 打つ</button>
    </div>
    <div id="cpFreeInfo" class="small" style="display:none"></div>
    <div id="cpList"></div>
  </div>
  <div class="row" id="mainRow" style="flex-wrap:nowrap;gap:5px">
    <button id="btnImg">🖼 画像</button>
    <button id="mainWatch" class="wbtn" style="display:none">🖥 自動</button>
    <button class="bsShot bsb" style="display:none">📸 BS</button>
    <input id="file" type="file" accept="image/*">
    <div id="tabs"><button data-step="ball">① 玉</button><button data-step="place">② 配置</button><button data-step="aim">③ 狙う</button></div>
    <button id="more" title="その他">⋯</button>
  </div>
  <div class="stepRow" id="row-ball">
    <span class="small grow">キャラの真ん中をタップ → 拡大されるので、十字をキャラの中心に合わせる</span>
    <button id="zoomBtn">🔍 全体</button>
    <button class="next" data-go="place">次へ ▶</button>
  </div>
  <div class="stepRow" id="row-place">
    <div class="seg"><button id="shCircle" class="on">●敵</button><button id="shRect">■壁</button><button id="shMine">✱地雷</button></div>
    <button id="eBook" title="選んだ敵を「最後に殴る相手（本・ボス）」にする">★</button>
    <button id="szMinus" title="敵を小さく">−</button><button id="szPlus" title="敵を大きく">＋</button>
    <button id="eDel">削除</button>
    <span class="grow"></span>
    <button class="next" data-go="aim">次へ ▶</button>
  </div>
  <div class="stepRow" id="row-aim">
    <button data-da="-1">−1°</button>
    <button data-da="-0.1">−.1</button>
    <span id="angle">0.0°</span>
    <button data-da="0.1">+.1</button>
    <button data-da="1">+1°</button>
  </div>
  <div class="stepRow" id="row-type">
    <div class="seg"><button id="tRef">反射</button><button id="tPie">貫通</button></div>
    <button id="tAB">アンチブロック</button>
  </div>
  <div class="stepRow" id="row-stab"><span id="stab" class="small" style="display:none"></span></div>
  <div class="stepRow" id="row-aim2">
    <span class="small">反射</span>
    <button id="bMinus">−</button>
    <b id="bv" style="min-width:22px;text-align:center;font-size:15px">5</b>
    <button id="bPlus">＋</button>
    <span class="grow"></span>
    <button id="mSearch">探す</button>
    <button id="mArrow">矢印</button>
    <button id="mFinger">指</button>
    <button id="pin">固定</button>
    <button class="bsFire bsb" style="display:none">🎯 打つ</button>
  </div>
  <div id="pad">パッド</div>
  <div id="menu">
    <button id="courseBtn">📚 コース</button>
    <button id="stages">📁 ステージ保存・読み込み</button>
    <button id="watchBtn" style="display:none">🖥 スクショフォルダを自動で読む（PC）</button>
    <button id="bsBtn">🎮 BlueStacks連携（PC）</button>
    <button id="kpBtn">新しい画像の配置：毎回聞く</button>
    <button id="dim">画面：通常</button>
    <button id="detect">敵・ブロックを自動検出</button>
    <button id="eClear" class="danger">敵とブロックを全部消す</button>
    <button id="clearPins">固定した線を消す</button>
    <button id="mField">枠を調整する</button>
    <button id="width">玉の通り道を表示</button>
    <button id="wobble">ブレ幅 ±0.5°</button>
    <button id="pull">タッチした方向に飛ばす</button>
    <label class="sl">玉の当たり半径 <input id="radius" type="range" min="20" max="120" value="55"><b id="rv">55</b></label>
    <div class="small" style="text-align:right" id="ver"></div>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
(() => {
  const VERSION = '2.82';
  // home-screen app: reload when a newer version is deployed
  async function checkUpdate() {
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
      const {v} = await r.json();
      if (v && v !== VERSION && sessionStorage.getItem('reloadedFor') !== v) {
        sessionStorage.setItem('reloadedFor', v);
        location.replace(location.pathname + '?v=' + v);
      }
    } catch (e) {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const loupe = document.createElement('canvas');

  // ---- state (all in image-pixel coordinates) ----
  let img = null;                    // HTMLImageElement or null
  let IW = 1170, IH = 2532;          // virtual size when no image (iPhone screenshot)
  // ratio of image size. Calibrated from 2 gameplay videos (iPhone 1170x2532):
  // ball CENTER bounces at x=52..1117, y=480..1692 (wall line minus WALL_PAD).
  const DEFAULT_FIELD = {l: 40 / 1170, t: 468 / 2532, r: 1129 / 1170, b: 1704 / 2532};
  const OLD_DEFAULT = {l: .035, t: .187, r: .965, b: .676};
  const WALL_PAD = 12 / 1170;
  const GUIDE_R = 100 / 1170;
  // Block = one cell of the 8-column grid (1170/8 = 146.25px), measured from gameplay video.
  // Minion hitbox: measured radius ≈73px on 2 different enemies (of 1170); centre ≈93–114px above its HP bar.
  const MINION_R = 73;
  const MINE_R = 32;   // mine pickup radius (approx., image px of 1170)
  const BLOCK = 1 / 8;            // cell width / stack pitch (146.25px of 1170)
  const BLOCK_H = 169 / 1170;     // hitbox height: sprite top-8 .. sprite bottom+5 (measured)
  const blockImg = new Image(); blockImg.src = 'block.png'; blockImg.onload = () => draw();
  // blocks are 146x146 cells; when near another block, snap so they connect edge to edge
  function placeBlock(l, t, self = -1) {
    const W = BLOCK * IW, snap = W * .35;
    let best = null, bd = snap;
    S.blocks.forEach((B, k) => {
      if (k === self) return;
      for (const [cl, ct] of [[B.l - W, B.t], [B.l + W, B.t], [B.l, B.t - W], [B.l, B.t + W]]) {   // stack pitch = W
        const d = Math.hypot(cl - l, ct - t);
        if (d < bd && !S.blocks.some((o, j) => j !== self && j !== k && Math.abs(o.l - cl) < 1 && Math.abs(o.t - ct) < 1)) { bd = d; best = [cl, ct]; }
      }
    });
    if (best) [l, t] = best;
    return {l, t, r: l + W, b: t + BLOCK_H * IW};
  }

  // ---- block auto-detection (template = top face of the block sprite, normalized cross-correlation) ----
  let tplCache = null;
  function grayAt(src, sx, sy, sw, sh, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) out[i] = d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114;
    return out;
  }
  function detectBlocks() {
    if (!img || !blockImg.naturalWidth) return [];
    const k = 4 * IW / 1170;                 // work at 1/4 scale of a 1170-wide screen
    const tw = Math.round(112 / 4), th = Math.round(100 / 4);
    if (!tplCache) {
      const t = grayAt(blockImg, 12, 6, 112, 100, tw, th);
      let m = 0; t.forEach(v => m += v); m /= t.length;
      let ss = 0; for (let i = 0; i < t.length; i++) { t[i] -= m; ss += t[i] * t[i]; }
      tplCache = {t, n: Math.sqrt(ss)};
    }
    const {t, n: tn} = tplCache;
    const f = S.field, x0 = Math.max(0, f.l - 20), y0 = Math.max(0, f.t - 60);
    const W = Math.round((f.r - x0 + 20) / k), H = Math.round((f.b - y0 + 20) / k);
    const g = grayAt(img, x0, y0, W * k, H * k, W, H);
    const RW = W - tw, RH = H - th, res = new Float32Array(Math.max(0, RW * RH));
    // integral images for fast local mean/variance
    const I = new Float64Array((W + 1) * (H + 1)), I2 = new Float64Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = g[y * W + x], i = (y + 1) * (W + 1) + x + 1;
      I[i] = v + I[i - 1] + I[i - W - 1] - I[i - W - 2]; I2[i] = v * v + I2[i - 1] + I2[i - W - 1] - I2[i - W - 2];
    }
    const N = tw * th;
    for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
      const a = y * (W + 1) + x, b = a + tw, c = a + th * (W + 1), d = c + tw;
      const sum = I[d] - I[b] - I[c] + I[a], sum2 = I2[d] - I2[b] - I2[c] + I2[a];
      const vs = sum2 - sum * sum / N; if (vs < 1e-3) continue;
      let acc = 0;
      for (let j = 0; j < th; j++) { const row = (y + j) * W + x, tr = j * tw; for (let i = 0; i < tw; i++) acc += g[row + i] * t[tr + i]; }
      res[y * RW + x] = acc / (Math.sqrt(vs) * tn);
    }
    const score = (ix, iy) => {        // best score near an image-px position of the sprite-face top-left
      const cx = Math.round((ix - x0) / k), cy = Math.round((iy - y0) / k); let m = -1;
      for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++)
        if (x >= 0 && y >= 0 && x < RW && y < RH) m = Math.max(m, res[y * RW + x]);
      return m;
    };
    // peaks
    const peaks = [], r2 = res.slice();
    for (;;) {
      let bi = -1, bv = .6;
      for (let i = 0; i < r2.length; i++) if (r2[i] > bv) { bv = r2[i]; bi = i; }

    else { const a1 = (l - x) / dx, a2 = (r - x) / dx; txn = Math.min(a1, a2); txf = Math.max(a1, a2); }
    if (Math.abs(dy) < 1e-9) { if (y <= tp || y >= bt) return null; tyn = -Infinity; tyf = Infinity; }
    else { const b1 = (tp - y) / dy, b2 = (bt - y) / dy; tyn = Math.min(b1, b2); tyf = Math.max(b1, b2); }
    const ten = Math.max(txn, tyn), tex = Math.min(txf, tyf);
    if (!(ten < tex && ten > 1e-6)) return null;
    return {t: ten, fx: Math.abs(txn - ten) < 1e-6, fy: Math.abs(tyn - ten) < 1e-6};
  }
  function rayEnemy(x, y, dx, dy, e, pad) {
    let best = null;
    for (const B of stepRects(e)) { const h = rayBox(x, y, dx, dy, B, pad); if (h && (!best || h.t < best.t)) best = h; }
    return best;
  }
  function stepPath(e) {   // outline of the stepped circle in screen space
    const R = stepRects(e).filter(B => B.t >= e.y).sort((a, b) => a.t - b.t);   // lower half, top→bottom
    const pts = [];
    R.forEach(B => { pts.push([B.r, B.t], [B.r, B.b]); });
    for (let i = R.length - 1; i >= 0; i--) pts.push([R[i].l, R[i].b], [R[i].l, R[i].t]);
    const up = pts.map(([x, y]) => [x, 2 * e.y - y]);
    ctx.beginPath();
    pts.forEach(([x, y], i) => { const [sx, sy] = toS(x, y); ctx[i ? 'lineTo' : 'moveTo'](sx, sy); });
    up.reverse().forEach(([x, y]) => { const [sx, sy] = toS(x, y); ctx.lineTo(sx, sy); });
    ctx.closePath();
  }

  // ---- reflection ----
  // returns points; pts.hits = indices of enemies touched, pts.kinds[i] = 'w' | 'e' for each bounce
  function trace(bx, by, angDeg, pad, n) {
    const f = S.field;
    const xmin = f.l + pad, xmax = f.r - pad, ymin = f.t + pad, ymax = f.b - pad;
    const pts = [[bx, by]]; pts.hits = new Set(); pts.kinds = []; pts.sig = []; pts.ev = [];
    const gotM = new Set(), MR = MINE_R * IW / 1170 + S.r;
    if (xmin >= xmax || ymin >= ymax) return pts;
    let x = bx, y = by;
    const a = angDeg * Math.PI / 180;
    let dx = Math.cos(a), dy = Math.sin(a);
    const E = S.enemies, rb = S.r;
    // A ball that starts touching a block just leaves it (blocks only; enemies still collide).
    const tol = 10 * IW / 1170, skipB = new Set();
    S.blocks.forEach((B, k) => {
      const l = Math.min(B.l, B.r) - rb - tol, r = Math.max(B.l, B.r) + rb + tol, t = Math.min(B.t, B.b) - rb - tol, b = Math.max(B.t, B.b) + rb + tol;
      if (bx > l && bx < r && by > t && by < b) skipB.add(k);
    });
    for (let i = 0; i <= n; i++) {
      const tx = dx > 1e-9 ? (xmax - x) / dx : dx < -1e-9 ? (xmin - x) / dx : Infinity;
      const ty = dy > 1e-9 ? (ymax - y) / dy : dy < -1e-9 ? (ymin - y) / dy : Infinity;
      let t = Math.max(0, Math.min(tx, ty)), hitE = -1;
      let hitN = null;
      if (!S.pierce) {
        E.forEach((e, k) => {
          const h = rayEnemy(x, y, dx, dy, e, rb);
          if (h && h.t < t) { t = h.t; hitE = k; hitN = h; }
        });
      }
      let hitB = -1, flipX = false, flipY = false;
      S.blocks.forEach((B, k) => {
        if (S.antiBlock && !B.hard) return;      // anti-block passes normal blocks only
        if (i === 0 && skipB.has(k)) return;
        const rb2 = S.r, l = Math.min(B.l, B.r) - rb2, r = Math.max(B.l, B.r) + rb2, tp = Math.min(B.t, B.b) - rb2, bt = Math.max(B.t, B.b) + rb2;
        if (x > l && x < r && y > tp && y < bt) return;       // starting inside: ignore
        let txn, txf, tyn, tyf;
        if (Math.abs(dx) < 1e-9) { if (x <= l || x >= r) return; txn = -Infinity; txf = Infinity; }
        else { const a1 = (l - x) / dx, a2 = (r - x) / dx; txn = Math.min(a1, a2); txf = Math.max(a1, a2); }
        if (Math.abs(dy) < 1e-9) { if (y <= tp || y >= bt) return; tyn = -Infinity; tyf = Infinity; }
        else { const b1 = (tp - y) / dy, b2 = (bt - y) / dy; tyn = Math.min(b1, b2); tyf = Math.max(b1, b2); }
        const ten = Math.max(txn, tyn), tex = Math.min(txf, tyf);
        if (ten < tex && ten > 1e-6 && ten < t) {
          t = ten; hitB = k; hitE = -1;
          flipX = Math.abs(txn - ten) < 1e-6; flipY = Math.abs(tyn - ten) < 1e-6;
        }
      });
      if (!isFinite(t)) break;
      const x0 = x, y0 = y;
      x += dx * t; y += dy * t;
      {   // pass-through events on this segment, in path order
        const seg = [], sx = x - x0, sy = y - y0, L = Math.hypot(sx, sy) || 1, ux = sx / L, uy = sy / L;
        S.mines.forEach((m, k) => {
          if (gotM.has(k)) return;
          const fx = m.x - x0, fy = m.y - y0, along = fx * ux + fy * uy, perp = Math.abs(fx * uy - fy * ux);
          if (perp > MR) return;
          const enter = along - Math.sqrt(MR * MR - perp * perp);
          if (enter <= L && along + MR >= 0) seg.push([Math.max(0, enter), 'm', k]);
        });
        if (S.pierce) E.forEach((e, k) => { const h = rayEnemy(x0, y0, ux, uy, e, rb); if (h && h.t <= L) seg.push([h.t, 'e', k]); });
        seg.sort((p, q) => p[0] - q[0]).forEach(([, ty, k]) => { if (ty === 'm') gotM.add(k); pts.ev.push([ty, k, i]); });
      }
      if (S.pierce) E.forEach((e, k) => {               // pass-through: mark every enemy the segment touches
        const sx = x - x0, sy = y - y0, L2 = sx * sx + sy * sy || 1;
        const u = Math.max(0, Math.min(1, ((e.x - x0) * sx + (e.y - y0) * sy) / L2));
        const L = Math.hypot(sx, sy) || 1, h = rayEnemy(x0, y0, sx / L, sy / L, e, rb);
        if (h && h.t <= L) pts.hits.add(k);
      });
      pts.push([x, y]);
      if (hitB >= 0) {
        if (flipX) dx = -dx;
        if (flipY) dy = -dy;
        pts.ev.push(['b', hitB, i]);
        pts.kinds.push('b'); pts.sig.push('b' + hitB + (flipX ? 'x' : '') + (flipY ? 'y' : ''));
      } else if (hitE >= 0) {
        if (hitN.fx) dx = -dx;
        if (hitN.fy) dy = -dy; pts.hits.add(hitE); pts.kinds.push('e'); pts.ev.push(['e', hitE, i]);
        pts.sig.push('e' + hitE + (hitN.fx ? 'x' : '') + (hitN.fy ? 'y' : ''));
      } else {
        const eps = 1e-6, fx = tx <= t + eps, fy = ty <= t + eps;
        if (fx) dx = -dx;
        if (fy) dy = -dy;
        if (fx) pts.ev.push(['w', dx > 0 ? 'L' : 'R', i]); if (fy) pts.ev.push(['w', dy > 0 ? 'T' : 'B', i]);
        pts.kinds.push('w'); pts.sig.push('w' + (fx ? (dx > 0 ? 'L' : 'R') : '') + (fy ? (dy > 0 ? 'T' : 'B') : ''));
      }
      if (S.pierce) pts.sig.push('h' + [...pts.hits].sort().join(','));
    }
    return pts;
  }

  // ---- drawing ----
  // segment colors: shot → after 1st bounce → after 2nd …
  const SEG = ['#ffffff', '#ffd43b', '#ff4d4d', '#3da5ff', '#3ddc84', '#d36bff', '#ff8c1a', '#00e5e5'];
  const segColor = i => SEG[i % SEG.length];

  const polyline = sp => { ctx.beginPath(); sp.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); };

  // pinned lines: dashed, single color, faint
  function drawPinned(pts) {
    const sp = pts.map(p => toS(p[0], p[1]));
    ctx.save();
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.setLineDash([7, 6]);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4; polyline(sp); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; polyline(sp); ctx.stroke();
    ctx.restore();
  }

  // current line: each segment in its own color, bounce points numbered in the color that follows
  function drawPath(pts) {
    const sp = pts.map(p => toS(p[0], p[1]));
    ctx.save();
    if (mode === 'arrow') ctx.globalAlpha = .28;   // keep the background visible while looking for a landmark
    ctx.lineJoin = ctx.lineCap = 'round';
    if (S.showWidth) {
      ctx.globalAlpha = .16; ctx.lineWidth = S.r * 2 * scale;
      for (let i = 0; i < sp.length - 1; i++) {
        ctx.strokeStyle = segColor(i); polyline([sp[i], sp[i + 1]]); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < sp.length - 1; i++) {
      ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 6.5; polyline([sp[i], sp[i + 1]]); ctx.stroke();
    }
    for (let i = 0; i < sp.length - 1; i++) {
      ctx.strokeStyle = segColor(i); ctx.lineWidth = 3.5; polyline([sp[i], sp[i + 1]]); ctx.stroke();
    }
    // bounce markers
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 1; i < sp.length - 1; i++) {
      const [x, y] = sp[i];

      ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = segColor(i); ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();

      const L = Math.hypot(x1 - x0, y1 - y0);
      if (L > 30) {
        const ux = (x1 - x0) / L, uy = (y1 - y0) / L;

        ctx.fillStyle = segColor(0); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(ax + ux * 11, ay + uy * 11);
        ctx.lineTo(ax - ux * 7 - uy * 8, ay - uy * 7 + ux * 8);
        ctx.lineTo(ax - ux * 7 + uy * 8, ay - uy * 7 - ux * 8);
        ctx.closePath(); ctx.stroke(); ctx.fill();
      }
    }
    ctx.restore();
  }

  let dragInfo = null;

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const [x0, y0] = toS(0, 0);
    if (img) {
      ctx.drawImage(img, x0, y0, IW * scale, IH * scale);
      if (S.dim) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x0, y0, IW * scale, IH * scale); }
    } else {
      ctx.fillStyle = '#151922'; ctx.fillRect(x0, y0, IW * scale, IH * scale);
      ctx.strokeStyle = '#1f2531'; ctx.lineWidth = 1;
      for (let gx = 0; gx <= IW; gx += 90) { const [a] = toS(gx, 0); ctx.beginPath(); ctx.moveTo(a, y0); ctx.lineTo(a, y0 + IH * scale); ctx.stroke(); }
      for (let gy = 0; gy <= IH; gy += 90) { const [, b] = toS(0, gy); ctx.beginPath(); ctx.moveTo(x0, b); ctx.lineTo(x0 + IW * scale, b); ctx.stroke(); }
      ctx.fillStyle = '#5b6475'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('「🖼 画像」でステージのスクショを選ぶ', w / 2, y0 + 200 * scale);
    }

    // field
    const f = S.field;
    const [fl, ft] = toS(f.l, f.t), [fr, fb] = toS(f.r, f.b);
    ctx.save();
    ctx.fillStyle = mode === 'field' ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.65)';
    ctx.beginPath(); ctx.rect(x0, y0, IW * scale, IH * scale); ctx.rect(fl, ft, fr - fl, fb - ft); ctx.fill('evenodd');
    ctx.strokeStyle = mode === 'field' ? '#ff6b6b' : 'rgba(255,255,255,.55)';
    ctx.lineWidth = mode === 'field' ? 2.5 : 1.5;
    ctx.setLineDash(mode === 'field' ? [] : [6, 5]);
    ctx.strokeRect(fl, ft, fr - fl, fb - ft);
    if (mode === 'field') {
      ctx.fillStyle = '#ff6b6b';
      [[fl, ft], [fr, ft], [fl, fb], [fr, fb], [(fl + fr) / 2, ft], [(fl + fr) / 2, fb], [fl, (ft + fb) / 2], [fr, (ft + fb) / 2]]
        .forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.restore();

    // pinned
    const showLines = mode === 'aim' || mode === 'arrow' || mode === 'finger' || (mode === 'course' && (cpSel !== null || cpFree));   // ① 玉 / ② 配置 では線を出さない
    if (showLines) S.pins.forEach(p => drawPinned(trace(p.x, p.y, p.angle, wallPad(), p.bounces)));

    // current
    const pts = trace(S.ball.x, S.ball.y, S.angle, wallPad(), S.bounces);
    drawBlocks();
    drawMines(showLines ? pts.ev : []);
    drawEnemies(showLines ? pts.hits : new Set());
    if (showLines && courseOn) drawHitOrder(pts.ev);
    if (courseOn) {
      const el = $('cpFreeInfo'); el.style.display = cpFree ? '' : 'none';
      if (cpFree) {
        const o = hitOrder(pts.ev), mines = new Set(pts.ev.filter(q => q[0] === 'm').map(q => q[1])).size;
        el.innerHTML = `<b style="color:var(--accent)">${displayAngle()}°</b>　<b style="color:#ff8fb1">${o.length ? o.map((k, i) => `${i + 1}${(S.enemies[k] && S.enemies[k].k) || '敵'}`).join('→') : '敵に当たらない'}${mines ? `（地雷${mines}）` : ''}</b>`;
      }
    }
    if (showLines) {
      if (S.wobble > 0 && !courseOn) [-S.wobble, S.wobble].forEach(w => drawWobble(trace(S.ball.x, S.ball.y, S.angle + w, wallPad(), S.bounces)));
      drawPath(pts);
    }

    if (mode === 'place' && selBlock >= 0 && S.blocks[selBlock]) drawPlusHandles(S.blocks[selBlock]);

    // ball
    const [bx, by] = toS(S.ball.x, S.ball.y);
    ctx.save();
    // guide circle = size of the turn ring around the character (align this to the character)
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(bx, by, GUIDE_R * IW * scale, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,207,63,.22)'; ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, S.r * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx - 10, by); ctx.lineTo(bx + 10, by); ctx.moveTo(bx, by - 10); ctx.lineTo(bx, by + 10); ctx.stroke();
    ctx.restore();

    // pull indicator (Monst-style): from touch start to finger
    if (dragInfo && dragInfo.kind === 'pull') {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(dragInfo.sx0, dragInfo.sy0); ctx.lineTo(dragInfo.sx, dragInfo.sy); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.arc(dragInfo.sx0, dragInfo.sy0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // ball being moved (after long-press)
    if ((dragInfo && dragInfo.kind === 'ball') || mode === 'ball' || mode === 'course') {
      ctx.save(); ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(bx, by, Math.max(S.r * scale, 14) + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    // loupe while dragging
    if (mode === 'finger') drawFingerMode();
    else if (mode === 'arrow') drawArrowMode(pts);
    else if (padFocus) { const [fx, fy] = toS(padFocus[0], padFocus[1]); drawLoupe(fx, fy); }
    else if (dragInfo && dragInfo.kind !== 'pull' && dragInfo.kind !== 'pending') drawLoupe(dragInfo.sx, dragInfo.sy);

    document.getElementById('angle').textContent = displayAngle() + '°';
    if (mode === 'aim' || mode === 'arrow' || mode === 'finger') updateStability();
    if (mode === 'course') $('stab').style.display = 'none'; else $('stab').style.display = 'none';
  }

  // ---- stability: how far can the angle drift before the route (what it hits, in order) changes? ----
  const STAB_STEP = 0.02, STAB_MAX = 3;
  let stabCache = '';
  function routeSig(ang) { return trace(S.ball.x, S.ball.y, ang, wallPad(), S.bounces).ev.map(q => q[0] + q[1]).join('|'); }   // same things touched in the same order
  function stabRange() {
    const ref = routeSig(S.angle); let lo = 0, hi = 0;
    while (lo < STAB_MAX && routeSig(S.angle - lo - STAB_STEP) === ref) lo += STAB_STEP;
    while (hi < STAB_MAX && routeSig(S.angle + hi + STAB_STEP) === ref) hi += STAB_STEP;
    return {lo, hi};   // degrees (screen angle: + = clockwise)
  }
  let lastStab = null;
  function updateStability() {
    const key = [S.angle, S.ball.x, S.ball.y, S.bounces, S.pierce, S.antiBlock, JSON.stringify(S.enemies), JSON.stringify(S.blocks), JSON.stringify(S.mines), S.r].join(';');
    if (key !== stabCache) { stabCache = key; lastStab = stabRange(); }
    const {lo, hi} = lastStab, m = Math.min(lo, hi), el = $('stab');
    el.style.display = '';
    const f = v => v >= STAB_MAX ? `${STAB_MAX}°以上` : `${v.toFixed(2)}°`;
    const lvl = m < .15 ? ['危険', '#ff5c5c'] : m < .5 ? ['シビア', '#ffb020'] : ['安定', '#3ddc84'];
    el.innerHTML = `<b style="color:${lvl[1]}">${lvl[0]}</b> ずれ許容 −${f(lo)} / ＋${f(hi)}` +
      (Math.abs(hi - lo) > .06 && Math.min(lo, hi) < STAB_MAX ? ` <button id="toCenter">真ん中へ</button>` : '');
    const b = $('toCenter');
    if (b) b.onclick = () => { S.angle += (hi - lo) / 2; persist(); draw(); };
  }
  let padFocus = null;
  let ballZoom = null;   // [x, y] centre of the zoomed ① 玉 view, or null for the whole field
  const syncZoom = () => { const b = document.getElementById('zoomBtn'); if (b) { b.textContent = ballZoom ? '🔍 全体' : '🔍 拡大'; b.classList.toggle('on', !!ballZoom); } };

  // ---- tap-to-snap: find the orange turn ring near the tapped point ----
  function findRing(tx, tyy) {
    if (!img) return null;
    const u = IW / 1170, search = Math.round(80 * u), Rmax = Math.round(118 * u);
    const x0 = Math.max(0, Math.round(tx - search - Rmax)), y0 = Math.max(0, Math.round(tyy - search - Rmax));
    const w = Math.min(IW - x0, 2 * (search + Rmax)), h = Math.min(IH - y0, 2 * (search + Rmax));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(img, x0, y0, w, h, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, m = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
      if (mx < 150 || mx === mn || (mx - mn) / mx < .47 || mx !== r) continue;
      const hue = 60 * (gg - b) / (mx - mn);          // red is max: hue in degrees
      if (hue >= -10 && hue <= 60) m[i] = 1;           // red / orange / gold (the ring colour varies)
    }
    const N = 120, cs = [], sn = [];
    for (let k = 0; k < N; k++) { cs.push(Math.cos(k / N * 2 * Math.PI)); sn.push(Math.sin(k / N * 2 * Math.PI)); }
    const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : m[(y | 0) * w + (x | 0)];
    let best = null;
    for (let R = Math.round(86 * u); R <= Rmax; R += 2) for (let cy = tyy - search; cy <= tyy + search; cy += 2) for (let cx = tx - search; cx <= tx + search; cx += 2) {
      const lx = cx - x0, ly = cy - y0; let v = 0, inn = 0;
      for (let k = 0; k < N; k++) { v += at(lx + cs[k] * R, ly + sn[k] * R); inn += at(lx + cs[k] * R * .6, ly + sn[k] * R * .6); }
      const sc = (v - .5 * inn) / N;
      if (!best || sc > best.s) best = {s: sc, x: cx, y: cy};
    }
    return best && best.s > .5 ? best : null;   // only a clearly visible ring
  }

  // ---- turn-order labels (1st/2nd/3rd/4th, optional in-game setting): red text with a white outline,
  // drawn right above each ball. Ball centre = label bbox centre + 58.5px (of 1170) down. Checked on BlueStacks and iPhone recordings.
  let labelCache = null;
  function findLabelBalls() {
    if (!img) return [];
    if (labelCache && labelCache.img === img) return labelCache.v;
    const u = IW / 1170, f = S.field;
    const x0 = Math.max(0, Math.round(f.l - 40 * u)), y0 = Math.max(0, Math.round(f.t - 80 * u));

  // ======== route search: scan every angle, score by the goal ========
  function scoreRoute(ev, goal) {
    const bi = ev.findIndex(q => q[0] === 'e' && S.enemies[q[1]] && S.enemies[q[1]].role === 'book');
    if (bi < 0) return null;
    const before = ev.slice(0, bi);
    const mines = new Set(before.filter(q => q[0] === 'm').map(q => q[1])).size;
    const walls = new Set(before.filter(q => q[0] === 'w').map(q => q[1])).size;
    const link = new Set(before.filter(q => q[0] === 'e' && q[1] !== ev[bi][1]).map(q => q[1])).size;
    const okM = mines >= (goal.mines || 0), okW = walls >= (goal.walls || 0);
    return {bi, seg: ev[bi][2], mines, walls, link, ok: okM && okW, score: (okM ? 1e5 : 0) + (okW ? 1e5 : 0) + Math.min(mines, 4) * 300 + walls * 200 + (goal.link ? link * 1000 : 0) - bi};
  }
  function searchRoutes() {
    const books = S.enemies.filter(e => e.role === 'book').length;
    if (!books) { toast('「② 配置」で本・ボスを選んで★を付けてください', 3000); return; }
    const cs = courseStage(), goal = cs ? cs.st.goal : {mines: S.mines.length ? 1 : 0, link: true};
    const N = Math.max(S.bounces, 8), res = [];
    for (let a = -180; a < 180; a += 0.25) {
      const p = trace(S.ball.x, S.ball.y, a, wallPad(), N), sc = scoreRoute(p.ev, goal);
      if (sc) {
        const nb = sc.seg + 1;
        res.push({a, ...sc, nb, sig: JSON.stringify(p.ev.slice(0, sc.bi + 1).map(q => q.slice(0, 2)))});
      }
    }
    // merge neighbouring angles that give the same route; keep the middle angle and the width
    res.sort((p, q) => p.a - q.a);
    const groups = [];
    res.forEach(r => { const g = groups[groups.length - 1]; if (g && g.sig === r.sig && Math.abs(r.a - g.a1) < .3) { g.a1 = r.a; g.n++; } else groups.push({...r, a0: r.a, a1: r.a, n: 1}); });
    groups.forEach(g => { g.mid = (g.a0 + g.a1) / 2; g.width = g.a1 - g.a0 + .25; g.score += Math.min(g.width, 3) * 80; });
    groups.sort((p, q) => q.score - p.score);
    const top = groups.slice(0, 8);
    const disp = a => { let d = a + 90; d = ((d + 180) % 360 + 360) % 360 - 180; return d.toFixed(1); };
    let html = `<h3>🔍 ルート候補</h3><div class="small">目標：${goal.mines ? `地雷${goal.mines}個 ` : ''}${goal.walls ? `壁${goal.walls}面 ` : ''}→ ★を殴る。幅＝ずれても同じルートになる角度の幅</div>`;
    if (!top.length) html += '<div class="small">★に届くルートが見つかりませんでした。反射の回数を増やすか、配置を確認してください。</div>';
    top.forEach((g, i) => {
      const w = g.width, lvl = w < .3 ? '🔴' : w < 1 ? '🟠' : '🟢';
      html += `<div class="res"><span class="ang">${disp(g.mid)}°</span><span class="d">${g.ok ? '✅ 目標達成' : '△ 目標未達'}　地雷${g.mines}・壁${g.walls}面・リンク${g.link}体<br>${lvl} 幅 ${w.toFixed(2)}°</span><button data-ang="${g.mid}" data-nb="${g.nb}">使う</button></div>`;
    });

  // ======== route collection: routes from the video that start near the current ball ========
  // walls-only path (all-pierce, no blocks): list of segments {x0,y0,x1,y1,dx,dy}
  function wallPath(x, y, ang, n) {
    const f = S.field, p = wallPad(), xmin = f.l + p, xmax = f.r - p, ymin = f.t + p, ymax = f.b - p;
    x = Math.min(Math.max(x, xmin), xmax); y = Math.min(Math.max(y, ymin), ymax);
    let dx = Math.cos(ang * Math.PI / 180), dy = Math.sin(ang * Math.PI / 180); const segs = [];
    for (let i = 0; i < n; i++) {
      const tx = dx > 1e-9 ? (xmax - x) / dx : dx < -1e-9 ? (xmin - x) / dx : Infinity;
      const ty = dy > 1e-9 ? (ymax - y) / dy : dy < -1e-9 ? (ymin - y) / dy : Infinity;
      const t = Math.max(0, Math.min(tx, ty)); if (!isFinite(t)) break;
      const x1 = x + dx * t, y1 = y + dy * t; segs.push({x0: x, y0: y, x1, y1, dx, dy});
      x = x1; y = y1; if (tx <= t + 1e-6) dx = -dx; if (ty <= t + 1e-6) dy = -dy;
    }
    return segs;
  }
  // does the current ball sit on a recorded route (its path forward, or a little behind its start)?
  function matchRoutes(list) {
    const f = S.field, W = f.r - f.l, H = f.b - f.t, u = IW / 1170, TOL = 30 * u, out = [];
    list.forEach(r => {
      const px = f.l + r.x * W, py = f.t + r.y * H;
      const fwd = wallPath(px, py, r.a, 6).map((sg, i) => ({...sg, leg: i + 1}));
      const back = wallPath(px, py, r.a + 180, 2).map((sg, i) => ({x0: sg.x1, y0: sg.y1, x1: sg.x0, y1: sg.y0, dx: -sg.dx, dy: -sg.dy, leg: -(i + 1)}));
      let best = null;
      [...back, ...fwd].forEach(sg => {
        const vx = sg.x1 - sg.x0, vy = sg.y1 - sg.y0, L2 = vx * vx + vy * vy || 1;
        const t = Math.max(0, Math.min(1, ((S.ball.x - sg.x0) * vx + (S.ball.y - sg.y0) * vy) / L2));
        const d = Math.hypot(sg.x0 + vx * t - S.ball.x, sg.y0 + vy * t - S.ball.y);
        if (d < TOL && (!best || d < best.d)) best = {d, ang: Math.atan2(sg.dy, sg.dx) * 180 / Math.PI, leg: sg.leg};
      });
      if (best) out.push({...r, ...best, dpx: Math.round(best.d / u)});
    });
    out.sort((p, q) => p.d - q.d);
    const uniq = [];   // merge routes that give (almost) the same angle
    out.forEach(m => { if (!uniq.some(o => Math.abs(((o.ang - m.ang + 540) % 360) - 180) < .6)) uniq.push(m); });
    return uniq;
  }
  function routeSheet() {
    const cs = courseStage();
    if (!cs) { toast('先に ⋯ →「📚 コース」でステージを選んでください', 3000); return; }
    const list = (ROUTES[cs.c.id] || []).filter(r => r.s === curCourse.s && (r.p == null || r.p === (curCourse.p || 0)));   // only this phase's routes
    const M = matchRoutes(list);
    const disp = a => { let d = a + 90; d = ((d + 180) % 360 + 360) % 360 - 180; return d.toFixed(1); };
    const mmss = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    const where = m => m.leg < 0 ? 'ルートの打ち出しの後ろ側' : m.leg === 1 ? 'ルートの1本目の線の上' : `ルートの${m.leg}本目の線の上（${m.leg - 1}回反射した後）`;
    let html = `<h3>📼 ${esc(cs.c.name)} ${esc(cs.st.n)}：今の玉から取れるルート</h3>
      <div class="small">ルート集の${list.length}本から、今の玉がそのルートの線の上（または打ち出しの少し後ろ）にあるものを探しました。そこから同じ向きに打てば、壁だけで反射するのでその先は同じルートになります。</div>`;
    if (!M.length) html += `<div class="small" style="padding:10px 0">今の玉の位置から乗れるルートはありませんでした（ずれ30px以内で探しています）。玉の位置を確認してください。</div>`;
    M.forEach(m => {
      const lv = m.dpx <= 10 ? '🟢' : m.dpx <= 20 ? '🟠' : '🟡';
      html += `<div class="stg"><img src="course/r/${m.id}.jpg" alt=""><div class="tx"><b>${disp(m.ang)}°</b>　${lv} ずれ${m.dpx}px<br>${where(m)}<br>元のルート：動画 ${mmss(m.t)}
        <div style="margin-top:6px"><button data-ra="${m.ang}">この角度で打つ</button></div></div></div>`;
    });
    html += '<button id="closeS">閉じる</button><div class="small">全貫通・ブロックなし前提で、壁の反射だけで照合しています。角度は動画から測った値なので±1°ほどずれることがあります。</div>';
    openSheet(html, sh => {
      sh.querySelectorAll('[data-ra]').forEach(b => b.onclick = () => { S.angle = +b.dataset.ra; S.pierce = true; S.antiBlock = true; persist(); closeSheet(); setMode('aim'); });
      sh.querySelector('#closeS').onclick = closeSheet;
    });
  }


  document.getElementById('ver').textContent = 'v' + VERSION;
  window.addEventListener('resize', layout);
  // the stage changes size when the panel below grows/shrinks (course list, step rows): re-layout right away
  // so the canvas never shows a stretched frame
  try { new ResizeObserver(() => layout()).observe(document.getElementById("stage")); } catch (e) {}
  let savedStep = 'ball'; try { savedStep = localStorage.getItem('monst-step') || 'ball'; } catch (e) {}
  setMode('ball');
  try { const v = JSON.parse(localStorage.getItem('monst-course') || 'null'); if (v && v.on && COURSES.some(c => c.id === v.c)) enterCourse(v.c, v.s || 0); } catch (e) {}
  restoreImage();
})();
</script>
</body>
</html>
